  "zoneRules": [
    {
      "id": "pipe-fluid",
      "when": [
        {
          "token": "Disiplin.kode",
          "op": "eq",
          "value": "L"
        },
        {
          "token": "Area.fungsi.kode",
          "op": "ne",
          "value": "X"
        }
      ],
      "forEach": "fluid",
      "patterns": [
        "{SITE}-PIPE-{Fluid.kode}"
      ],
      "source": "doc 3.9 B"
    },
    {
      "id": "equi",
      "when": [
        {
          "token": "Disiplin.kode",
          "op": "eq",
          "value": "R"
        },
        {
          "token": "Area.fungsi.kode",
          "op": "ne",
          "value": "X"
        }
      ],
      "patterns": [
        "{SITE}-EQUI",
        "{SITE}-NIEQP"
      ],
      "source": "doc 3.9 D"
    },
    {
      "id": "handling-safety",
      "when": [
        {
          "token": "Disiplin.kode",
          "op": "in",
          "value": [
            "M",
            "S"
          ]
        },
        {
          "token": "Area.fungsi.kode",
          "op": "ne",
          "value": "X"
        }
      ],
      "patterns": [
        "{SITE}-EQUI",
        "{SITE}-NIEQP-TRAN",
        "{SITE}-NIEQP-LONG"
      ],
      "source": "doc 3.9 E/F"
    },
    {
      "id": "arch",
      "when": [
        {
          "token": "Disiplin.kode",
          "op": "eq",
          "value": "A"
        },
        {
          "token": "Area.fungsi.kode",
          "op": "ne",
          "value": "X"
        }
      ],
      "patterns": [
        "{SITE}-WALL"
      ],
      "source": "doc 3.9 G"
    },
    {
      "id": "hvac",
      "when": [
        {
          "token": "Disiplin.kode",
          "op": "eq",
          "value": "H"
        },
        {
          "token": "Area.fungsi.kode",
          "op": "ne",
          "value": "X"
        }
      ],
      "patterns": [
        "{SITE}-EQUI",
        "{SITE}-NIEQP",
        "{SITE}-DUCT"
      ],
      "source": "doc 3.9 H"
    },
    {
      "id": "dummy",
      "when": [
        {
          "token": "Area.fungsi.kode",
          "op": "eq",
          "value": "X"
        }
      ],
      "patterns": [
        "{SITE}-STRU",
        "{SITE}-EQUI"
      ],
      "source": "project addition 2026-10-21; see OPEN-ITEMS OI-01"
    }
  ],

    const refs = d.referenceDbs || [];
    if (out.includeReference && refs.length) {
      L = header('REFERENCE DBs - ADMIN: add to MDB', [gen, 'Run AFTER all disciplines.']);
      L.push(`SET MDB ${comb.mdb}`);
      for (const r of refs) L.push(r.active ? `ADD ${r.db} ${r.pos}` : `$* ADD ${r.db}   <- ${r.note || ''}`);
      add(E.render(cfg, t.refFolder, pctx), E.render(cfg, t.refFile, pctx), L, 'Admin', '90', `${refs.filter(r => r.active).length} ADD`);
    }

    if (out.includeFixup) {
      L = header('MDB FIX-UP - ADMIN: CURRENT db n for all (final order)',

      const mdbs = [...new Set([...model.cells.map(c => c.mdb), comb.mdb])];

    if (c.zones && !E.FACTS.newZoneTested) warn.push('B3: NEW ZONE after navigating to a site is not yet tested (facts sec 9).');
    const seen = new Set();
    for (const i of issues.filter(i => i.severity === 'warning' && i.id !== 'V19')) {
      const m = `${i.message} [${i.id}${i.ref && i.ref !== '-' ? ' ' + i.ref.replace('§', 'sec ') : ''}]`;
      if (!seen.has(m)) { seen.add(m); warn.push(m); }

    if (warn.length > shown.length) shown.push(`... ${warn.length - shown.length} more (see register sheet Validation)`);
    const widths = [4, 44, 14, 7];
    const row = r => ' ' + r.map((v, i) => (i < widths.length ? String(v).padEnd(widths[i]) : v)).join(' ').trimEnd();
    const L = [
      `${p.code} (${p.name}) - E3D SETUP PACKAGE`,
      `Generated ${E.stamp(date)} by E3D Setup Generator. Target: ${p.target}.`,
      '',
      'PREPARATION (Admin, SYSTEM)',
      ' - Delete old DBs of this setup if re-running. Check the MDB is empty and no old DB files remain.',
      ' - Nobody else logged in to the project.',
      '',
      'STEPS (command macros only)',
      ' 00-TEAMS -> per row: B1 (Admin) -> re-enter DESIGN -> B2 sites (Design) -> B3 zones (Design)',
      ` Rows in order: ${folders.join(', ')}`,
      ' Then 90-REFERENCE (Admin). 99-FIXUP only if the MDB order is wrong.',
      '',
      'RUN ORDER',
      row(['Step', 'What', 'File', 'Module', 'Check']),
      ...E.RUN_ORDER.map(row),
      '',
      'WARNINGS',
      ...(shown.length ? shown.map(w => ` - ${w}`) : [' - none']),
      '',
      'KNOWN ISSUE',
      ...E.KNOWN_ISSUE.map(s => ' ' + s),
      '',
      'COUNTS',
      ` Teams new/existing: ${c.teamsNew}/${c.teamsExisting}  DBs: ${c.dbs}  Sites: ${c.sites}  Separators: ${c.separators}  Zones: ${c.zones}  Reference DBs: ${c.refsActive}`,

/* Validation V01-V24 (docs/RULES.md §3). Each issue: {id, severity, ref, message, location}.
   location.screen: 1 Project, 2 Attribute, 3 Relasi & kombinasi, 4 Template, 5 Preview, 6 Generate. */
(function (E) {
  'use strict';

  const ID_RE = /^[a-z][a-z0-9_]*$/, NAME_RE = /^[A-Za-z][A-Za-z0-9_]*$/, COL_RE = /^[a-zA-Z][a-zA-Z0-9_]*$/;
  const empty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);

  E.validate = function (cfg, model, files) {
    const issues = [], d = cfg.d;
    const add = (id, severity, ref, message, location) => issues.push({ id, severity, ref, message, location: location || {} });
    const cellLoc = (c, extra) => Object.assign({ screen: 3, cell: [c.rowKode, c.colKode] }, extra);

    /* V02: attribute structure */
    const names = new Map(), ids = new Map();
    const roleCount = { team: 0, user: 0 };
    for (const a of d.attributes || []) {
      const loc = { screen: 2, attributeId: a.id };
      if (!ID_RE.test(a.id || '')) add('V02', 'error', '-', `Id attribute (${a.id}) harus [a-z][a-z0-9_]*`, loc);
      if (ids.has(a.id)) add('V02', 'error', '-', `Id attribute (${a.id}) duplikat`, loc);
      ids.set(a.id, a);
      if (!NAME_RE.test(a.name || '')) add('V02', 'error', '-', `Nama attribute (${a.name}) harus [A-Za-z][A-Za-z0-9_]* (tanpa spasi)`, loc);
      if (E.RESERVED_HEADS.includes(a.name)) add('V02', 'error', '-', `Nama attribute (${a.name}) dipakai oleh token sistem`, loc);
      if (names.has(a.name)) add('V02', 'error', '-', `Nama attribute (${a.name}) duplikat`, loc);
      names.set(a.name, a);
      if (a.role in roleCount && ++roleCount[a.role] === 2) add('V02', 'error', '-', `Lebih dari satu attribute berperan ${a.role}`, loc);
      const colIds = new Set();
      for (const c of a.columns || []) {
        const cl = Object.assign({ column: c.id }, loc);
        if (!COL_RE.test(c.id || '')) add('V02', 'error', '-', `Id kolom (${a.name}.${c.id}) tidak valid`, cl);
        if (colIds.has(c.id)) add('V02', 'error', '-', `Id kolom (${a.name}.${c.id}) duplikat`, cl);
        colIds.add(c.id);
        if ((c.type === 'ref' || c.type === 'refList') && !cfg.attrs[c.target])
          add('V02', 'error', '-', `Kolom ${a.name}.${c.id} menunjuk attribute (${c.target}) yang tidak ada`, cl);
      }
      for (const k of ['kode', 'desc']) if (!colIds.has(k)) add('V02', 'error', '-', `Attribute ${a.name} wajib punya kolom ${k}`, loc);
    }
    const { rowAttr, colAttr } = E.roles(cfg);
    const comb = d.combination || {};
    if (!rowAttr) add('V02', 'error', '-', `Attribute baris (${comb.rowAttr || '-'}) belum dipilih atau tidak ada`, { screen: 3 });
    if (!colAttr) add('V02', 'error', '-', `Attribute kolom (${comb.colAttr || '-'}) belum dipilih atau tidak ada`, { screen: 3 });
    if (colAttr && comb.groupBy) {
      const gc = cfg.col(colAttr.id, comb.groupBy);
      if (!gc || gc.type !== 'ref') add('V02', 'error', '-', `Grup kolom (${comb.groupBy}) harus kolom referensi di ${colAttr.name}`, { screen: 3 });
    }
    if (rowAttr && !cfg.col(rowAttr.id, 'urutan')) add('V02', 'error', '-', `Attribute baris ${rowAttr.name} perlu kolom angka 'urutan'`, { screen: 2, attributeId: rowAttr.id });

    /* V01: attribute data */
    for (const a of d.attributes || []) {
      const seen = new Set();
      (a.rows || []).forEach((r, i) => {

        if (!empty(r.kode) && seen.has(r.kode)) add('V01', 'error', '-', `Kode ${r.kode} (${a.name}) duplikat`, rl('kode'));

            continue;
          }
          if (c.type === 'number' && !Number.isInteger(v)) add('V01', 'error', '-', `${what} harus bilangan bulat (${v})`, rl(c.id));
          if (c.type === 'boolean' && typeof v !== 'boolean') add('V01', 'error', '-', `${what} harus ya/tidak`, rl(c.id));
          if (c.type === 'text' && typeof v !== 'string') add('V01', 'error', '-', `${what} harus teks`, rl(c.id));
          if ((c.type === 'ref' || c.type === 'refList') && cfg.rows[c.target]) {
            const tname = cfg.attrs[c.target].name;
            for (const x of c.type === 'ref' ? [v] : (Array.isArray(v) ? v : [v]))
              if (!cfg.rows[c.target].has(x)) add('V01', 'error', '-', `${what}: ${x} tidak ada di ${tname}`, rl(c.id));
          }

    }

    /* V03: template tokens resolve in their context */
    const t = d.templates || {};
    for (const [key, kind] of Object.entries(E.TEMPLATE_KINDS)) {
      if (empty(t[key])) {
        if (!E.OPTIONAL_TEMPLATES.includes(key)) add('V03', 'error', '-', `Template ${key} kosong`, { screen: 4, template: key });
        continue;
      }
      for (const m of E.checkTemplate(cfg, t[key], E.contextHeads(cfg, kind)))
        add('V03', 'error', '-', `Template ${key}: ${m}`, { screen: 4, template: key });
    }
    for (const [i, rule] of (d.zoneRules || []).entries()) {

    if (comb.mode === 'condition')
      for (const w of comb.condition || []) for (const m of E.checkTemplate(cfg, `{${w.token}}`, E.contextHeads(cfg, 'condition')))

      else if (!teams.has(c.team)) add('V05', 'error', '1.1, 1.12', `Team pemilik ${c.team} (${c.db}) tidak ada di tabel Team`, { screen: 4, template: 'dbName', cell: loc.cell });

        const prev = seenNo.get(n) || usedNo.get(n);
        if (prev) add('V07', 'error', '1.3', `DBNO ${n} (${c.db}) sudah dipakai oleh ${prev}`, cellLoc(c, { screen: 4, template: 'dbNo' }));

      let last = {};
      for (const c of dd.cells) {
        if (c.group !== last) {
          if (groups.includes(c.group)) add('V16', 'error', '3.4', `Grup ${c.group} tidak berurutan di baris ${dd.row.kode}`, { screen: 3, order: dd.row.kode });
          groups.push(c.group);
          last = c.group;

      }
      const order = E.siteOrder(dd);
      if (order.length && order[0].kind !== 'site' && order[0].db !== dd.cells[0].db)
        add('V24', 'error', '3.2, 3.3', `Separator ${order[0].name} dibuat sebelum site DB-nya`, { screen: 3, order: dd.row.kode });
      const elems = order.map(s => ({ name: s.name, loc: s.kind === 'site' ? { screen: 4, template: 'site' } : { screen: 4, template: s.kind } }));
      for (const c of dd.cells) c.zones.forEach((z, i) => elems.push({ name: z, loc: { screen: 4, zoneRuleId: c.zoneRules[i] } }));

    for (const f of files || []) {
      if (!E.isAscii(f.path)) add('V18', 'error', 'tool', `Nama file ${f.path} berisi karakter non-ASCII`, { screen: 6, file: f.path });
      f.text.split(/\r?\n/).forEach((line, i) => {

      if (!dd.cells.some(c => c.targeted))
        add('V20', 'warning', '-', `Tidak ada aturan zone yang menargetkan baris ${dd.row.kode} (${dd.row.desc})`, { screen: 4, field: 'zoneRules' });

    /* V21, V22: in-use list */
    if (!inUse || (!(inUse.teams || []).length && !(inUse.dbs || []).length)) {
      add('V22', 'info', '-', 'Daftar terpakai (Export Config) belum dimuat: bentrok dengan data project tidak dicek', { screen: 1, field: 'inUse' });
    } else if (teamAttr) {

      for (const r of teamAttr.rows || [])

          add('V21', 'warning', '-', `Team ${r.kode} sudah ada di project tapi ditandai baru (CREATE TEAM akan gagal: "Team name already defined")`,
            { screen: 2, attributeId: teamAttr.id, rowKode: r.kode, column: 'existing' });
    }
    return issues;
  };

  // Find an attribute cell whose text contains s (for V18 navigation).
  E.locateText = function (cfg, s) {
    for (const a of cfg.d.attributes || [])
      for (const [i, r] of (a.rows || []).entries())
        for (const c of a.columns || [])
          if (typeof r[c.id] === 'string' && r[c.id].includes(s)) return { screen: 2, attributeId: a.id, rowKode: r.kode, rowIndex: i, column: c.id };
    for (const [k, v] of Object.entries(cfg.d.project || {})) if (typeof v === 'string' && v.includes(s)) return { screen: 1, field: k };

    const issues = E.validate(cfg, model, files);

/* config.json: empty config, structural check, migration, canonical export (SPEC §3, §8.1). */
(function (E) {
  'use strict';

  // Key order of schema/config.schema.json. Unknown keys are kept and appended in their own order.
  const ORDER = {
    root: ['schema', 'project', 'mdbs', 'dbDefaults', 'attributes', 'combination', 'templates', 'zoneRules', 'referenceDbs', 'inUse', 'output'],
    project: ['code', 'name', 'target', 'filePrefix', 'packageName', 'lineEnding'],
    mdb: ['name', 'default'],
    dbDefaults: ['type', 'access', 'claim'],
    attribute: ['id', 'name', 'role', 'columns', 'rows'],
    column: ['id', 'name', 'type', 'required', 'target'],
    combination: ['rowAttr', 'colAttr', 'groupBy', 'mode', 'excluded', 'condition', 'mdb'],
    templates: ['dbName', 'dbDesc', 'dbNo', 'mdbPos', 'site', 'sepDiscipline', 'sepGroup', 'teamsFolder', 'teamsFile',
      'discFolder', 'b1File', 'b2File', 'b3File', 'refFolder', 'refFile', 'fixupFolder', 'fixupFile', 'registerFile'],
    clause: ['token', 'op', 'value'],
    zoneRule: ['id', 'when', 'forEach', 'patterns', 'source'],
    ref: ['db', 'pos', 'active', 'note'],
    inUse: ['teams', 'dbs', 'source', 'importedAt'],
    inUseDb: ['name', 'number'],

  function ordered(obj, keys, map) {
    if (!isObj(obj)) return obj;
    const out = {};
    for (const k of keys) if (k in obj) out[k] = map && map[k] ? map[k](obj[k]) : obj[k];
    for (const k of Object.keys(obj)) if (!(k in out)) out[k] = obj[k];
    return out;
  }

    const clauses = each(w => ordered(w, ORDER.clause));

      project: v => ordered(v, ORDER.project),
      mdbs: each(m => ordered(m, ORDER.mdb)),
      dbDefaults: v => ordered(v, ORDER.dbDefaults),
      attributes: each(a => {
        const cols = (a && a.columns || []).map(x => x.id);
        return ordered(a, ORDER.attribute, {
          columns: each(x => ordered(x, ORDER.column)),
          rows: each(r => ordered(r, cols)),

    eq([c.refsActive, c.refsInactive], [122, 3], 'reference DBs active/inactive');

    eq(r.counts.dbs, 249, 'DBs');
    const t = r.model.cells.filter(x => x.rowKode === 'T');
    eq([t[0].pos, t[t.length - 1].pos], [201, 224], 'T positions');
    eq(t.find(x => x.colKode === 'HK').dbno, 10941, 'T DBNO for HK');
    const b2 = fileMap(r)['09-T-ZRFTEL/ZRF-09-T-B2-SITES-DESIGN.mac'];
    ok(!b2.includes('/T----HULL-BODY----') && !b2.includes('/T-HBD'), 'B2 Telecom without HB');
  });
  test('N16', 'inUse DB ZRFPIP/DESI-L-M1D 10201 -> V07 and V08', () => {
    const r = mutate(c => { c.inUse = { teams: [], dbs: [{ name: 'ZRFPIP/DESI-L-M1D', number: 10201 }], source: 'test.xlsx', importedAt: '2026-10-23' }; });
    has(r, 'V07', 'error'); has(r, 'V08', 'error');
  });

  test('X1', 'Empty config computes without crash', () => {
    const r = run(E.emptyConfig());
    eq(r.counts.dbs, 0, 'no DBs');
  });
  test('X2', 'perStep split and multiple MDBs', () => {
    const r = mutate(c => {
      c.output.split = 'perStep';
      attr(c, 'disiplin').columns.push({ id: 'mdb', name: 'MDB', type: 'text', required: false });
      row(c, 'disiplin', 'N').mdb = '/MDB-STR';
      c.mdbs.push({ name: '/MDB-STR', default: false });
    });
    eq(ids(r.issues, 'error'), [], 'errors');
    const paths = r.files.map(f => f.path);
    ok(paths.includes('B1/ZRF-B1-CREATE-DB-MDB-ADMIN.mac') && paths.includes('B3/ZRF-B3-ZONES-DESIGN.mac'), 'perStep files');
    const b1 = commands(fileMap(r)['B1/ZRF-B1-CREATE-DB-MDB-ADMIN.mac']);
    eq(b1.filter(l => l.startsWith('CREATE DB')).length, 250, 'B1 CREATE count');
    ok(b1.includes('SET MDB /MDB-STR'), 'second MDB block');
    const fix = commands(fileMap(r)['99-FIXUP/ZRF-99-MDB-REORDER-ADMIN.mac']);
    eq(fix.filter(l => l.startsWith('SET MDB')).length, 2, '99 SET MDB per MDB');
  });
  test('X3', 'Expression parser', () => {
    eq(E.evaluate('10000 + 2 * 100 + 1'), 10201, 'precedence');
    eq(E.evaluate('(3 + 4) * 2 - -1'), 15, 'parentheses and unary minus');
    for (const bad of ['1 +', '2 / 0', '3 / 2', 'alert(1)', '']) {
      let threw = false;
      try { E.evaluate(bad); } catch (e) { threw = true; }
      ok(threw, `rejects '${bad}'`);
    }
  });
  test('X5', 'Import mapping: header guess, mapping, conversion', () => {
    const area = clone(preset).attributes.find(a => a.id === 'area');
    const table = [['SLOT', 'Kode', 'Deskripsi', 'grup'], ['31', 'ZZ', 'New', 'OTHERS'], ['', '', '', '']];
    ok(E.looksLikeHeader(area, table[0]), 'header detected');
    const map = E.guessMapping(area, table[0], true);
    eq([map.kode, map.desc, map.slot, map.grup, map.fungsi], [1, 2, 0, 3, -1], 'mapping');
    eq(E.mapTable(area, table.slice(1), map), [{ kode: 'ZZ', desc: 'New', slot: 31, grup: 'OTHERS', fungsi: '' }], 'rows');
    eq(E.guessMapping(area, ['a', 'b'], false).desc, 1, 'positional mapping');
    const other = [['AREA', 'DESCRIPTION', 'SLOT'], ['Q6', 'PR-M6', '18'], ['Q7', 'PR-M7', '19']];
    ok(E.looksLikeHeader(area, other[0], other.slice(1)), 'header with unfamiliar names detected');
    eq(E.guessMapping(area, other[0], true).slot, 2, 'unfamiliar header falls back to column order');
    ok(!E.looksLikeHeader(area, other[1], other.slice(2)), 'data row is not a header');
  });
  if (E.zip) {
    test('X4', 'ZIP and XLSX write -> read round trip', async () => {
      const r = run(clone(preset));
      const sheets = E.registerSheets(r.cfg, r.model, r.issues, r.files);
      const xlsx = await E.xlsx.write(sheets);
      const book = await E.xlsx.read(xlsx);
      const reg = book.find(s => s.name === 'DB Register');
      ok(reg && reg.rows.length === 251, 'DB Register rows');
      eq(reg.rows[0].slice(0, 3), ['No', 'Row', 'Row code'], 'header');
      eq(String(reg.rows[26][6]), 'ZRFPIP/DESI-L-M1D', 'first Piping DB');
      const zip = await E.zip.write([{ path: 'a/b.txt', data: 'hello\r\n' }, { path: 'c.bin', data: new Uint8Array([1, 2, 3]) }]);
      const entries = await E.zip.read(zip);
      eq(entries.map(e => e.path), ['a/b.txt', 'c.bin'], 'zip entries');
      eq(new TextDecoder().decode(entries[0].data), 'hello\r\n', 'zip text');
    });
  }
  return T;
};
if (typeof module !== 'undefined') module.exports = makeSuite;

(async function () {
  const out = document.getElementById('out'); let pass = 0, fail = 0;
  for (const t of makeSuite(E3D, PRESET, FIXTURES)) {
    try { await t.run(); pass++; out.textContent += 'PASS ' + t.id + '  ' + t.title + '\n'; }
    catch (e) { fail++; out.textContent += 'FAIL ' + t.id + '  ' + t.title + '\n  ' + e.message + '\n'; }
  }
  out.textContent += '\n' + pass + ' passed, ' + fail + ' failed\n';
  document.title = (fail ? 'FAIL' : 'PASS') + ' - E3D engine tests';
})();
