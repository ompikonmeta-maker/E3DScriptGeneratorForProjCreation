/* ---- material-design-3-project/md3-dynamic-color.js ---- */
/* =====================================================================
   Material Design 3 · Expressive — Dynamic Color Engine
   ---------------------------------------------------------------------
   Self-contained (no dependencies). Generates a full Material color
   scheme from a single seed color, in the spirit of Material You.

   Tones are the CIELAB L* value (0–100) — this is exactly how HCT
   defines "tone", so tonal mapping is faithful. Hue/chroma use CIE LCh,
   with automatic sRGB gamut clamping (chroma is reduced until the tone
   is reproducible), matching the perceptual intent of HCT closely
   without shipping the full CAM16 model.

   Public API (global `MD3`):
     MD3.applySeed('#6750A4', { style: 'expressive' })
     MD3.setTheme('light' | 'dark' | 'system')
     MD3.getTheme()            -> resolved 'light' | 'dark'

     MD3.schemeFromSeed(hex, style) -> { light, dark } role maps
   ===================================================================== */

  'use strict';

  /* ---------- sRGB <-> CIE Lab/LCh ---------- */
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  function hexToRgb(hex) {
    hex = hex.replace('#', '').trim();
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(r, g, b) {
    const h = v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(b);
  }
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = c => { const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return v * 255; };

  // D65 reference white
  const Xn = 95.047, Yn = 100.0, Zn = 108.883;

  function rgbToXyz(r, g, b) {
    r = lin(r); g = lin(g); b = lin(b);
    return [
      (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) * 100,
      (r * 0.2126729 + g * 0.7151522 + b * 0.0721750) * 100,
      (r * 0.0193339 + g * 0.1191920 + b * 0.9503041) * 100,

  function xyzToRgb(x, y, z) {
    x /= 100; y /= 100; z /= 100;
    return [
      gam(x * 3.2404542 + y * -1.5371385 + z * -0.4985314),
      gam(x * -0.9692660 + y * 1.8760108 + z * 0.0415560),

  function xyzToLab(x, y, z) {

    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];

        for (const c of cells) if (!groupSeps.has(c.group)) groupSeps.set(c.group, E.render(cfg, t.sepGroup, c.ctx));
      }
      model.disciplines.push({
        row: dr, ctx: dctx, cells, mdb: rowMdb,
        sepDiscipline: t.sepDiscipline ? E.render(cfg, t.sepDiscipline, dctx) : null,
        groupSeps,
      });
      model.cells.push(...cells);
    }
    return model;
  };

  // Site creation order of one row (drives B2): {kind, name, db, cell?, group?}. SPEC §4 steps 5-6.
  E.siteOrder = function (dd) {
    const out = [];
    if (dd.sepDiscipline) out.push({ kind: 'sepDiscipline', name: dd.sepDiscipline, db: dd.cells[0].db });
    let lastGroup = {};
    for (const c of dd.cells) {
      if (c.group !== lastGroup) {
        lastGroup = c.group;
        if (dd.groupSeps.has(c.group)) out.push({ kind: 'sepGroup', name: dd.groupSeps.get(c.group), db: c.db, group: c.group });
      }
      out.push({ kind: 'site', name: c.site, db: c.db, cell: c, group: c.group });
    }
    return out;
  };

  E.counts = function (cfg, model) {
    const teamAttr = cfg.role('team')[0];
    const teams = teamAttr ? teamAttr.rows || [] : [];
    const refs = cfg.d.referenceDbs || [];
    return {
      teamsNew: teams.filter(r => !r.existing).length,
      teamsExisting: teams.filter(r => r.existing).length,
      dbs: model.cells.length,
      sites: model.cells.length,
      separators: model.disciplines.reduce((n, dd) => n + (dd.sepDiscipline ? 1 : 0) + dd.groupSeps.size, 0),
      zones: model.cells.reduce((n, c) => n + c.zones.length, 0),
      refsActive: refs.filter(r => r.active).length,
      refsInactive: refs.filter(r => !r.active).length,
    };
  };
})(E3D);

/* ---- src/engine/generate.js ---- */
/* .mac files and README text. Formats: docs/OUTPUT-FORMAT.md. Command lines must stay identical
   to tools/reference_generator.py; comment lines are free text but kept identical too. */
(function (E) {
  'use strict';

  const header = (title, notes) => {
    const bar = '$* ' + '='.repeat(59);
    return [bar, `$* ${title}`, ...notes.map(n => `$* ${n}`), bar, '$*'];
  };
  E.eol = cfg => ((cfg.d.project || {}).lineEnding === 'LF' ? '\n' : '\r\n');
  const join = (lines, eol) => lines.join(eol) + eol;
  const NEW_ZONE_WARNING = 'WARNING: NEW ZONE after navigating to a site is not yet tested (facts sec 9).';

  // Run order (README, screen 6, register "Setup Steps"). ASCII only: it is written into README.
  E.RUN_ORDER = [
    ['P', 'Delete old DBs, MDB empty, nobody logged in', '-', 'Admin', 'Databases list'],
    ['0', 'New teams', '00-TEAMS', 'Admin', 'Team count'],
    ['B1', 'CREATE DB + ADD to MDB', 'per row', 'Admin', 'DBNO, MDB positions'],
    ['-', 'Re-enter DESIGN', '-', 'Design', 'New DBs visible'],
    ['B2', 'Separators + sites in display order', 'per row', 'Design', 'Model Explorer = Site Order'],
    ['B3', 'Zones', 'per row', 'Design', 'Zone count'],
    ['R', 'Repeat B1-B3 per row, in order', '-', '-', '-'],
    ['90', 'Reference DBs to MDB', '90-REFERENCE', 'Admin', 'MDB member count'],
    ['99', 'Fix MDB order (optional)', '99-FIXUP', 'Admin', 'Only if wrong'],
  ];
  E.KNOWN_ISSUE = [
    "Random '(43,41) Unable to open DB ... MCD:6 The handle is invalid' while creating DBs.",
    'Note the DB, delete it in Admin if broken, recreate it, continue.',
  ];

  function siteLines(dd, state) {
    const L = [];
    for (const s of E.siteOrder(dd)) {
      L.push(`NEW SITE ${s.name}` + (s.db !== state.lastDb ? ` DB ${s.db}` : ''));
      state.lastDb = s.db;
    }
    return L;
  }
  const zoneLines = dd => {
    const L = [];
    for (const c of dd.cells) if (c.zones.length) { L.push(c.site); for (const z of c.zones) L.push(`NEW ZONE ${z}`); }
    return L;
  };
  const createLines = (cfg, dd) => {
    const def = cfg.d.dbDefaults || {};
    return dd.cells.map(c => `CREATE DB ${c.db} ${def.type} ACCESS ${def.access} CLAIM ${def.claim} DBNO ${c.dbno} DESC '${c.desc}'`);
  };
  const addLines = dd => [`SET MDB ${dd.mdb}`, ...dd.cells.map(c => `ADD ${c.db} ${c.pos}`)];

  // Returns an ordered list of {path, folder, name, text, module, step, content}.
  E.generate = function (cfg, model) {
    const d = cfg.d, t = d.templates || {}, p = d.project || {}, out = d.output || {};
    const eol = E.eol(cfg), comb = d.combination || {};
    const pctx = {};
    const gen = `Generated by E3D Setup Generator - ${p.code} - ${p.target}`;
    const files = [];
    const add = (folder, name, lines, module, step, content) => {
      files.push({ path: folder ? `${folder}/${name}` : name, folder: folder || '', name, text: join(lines, eol), module, step, content });
    };

    // 00-TEAMS
    const teamAttr = cfg.role('team')[0];
    const teams = teamAttr ? teamAttr.rows || [] : [];
    const newTeams = teams.filter(r => !r.existing), oldTeams = teams.filter(r => r.existing);
    let L = header(`${p.code} - STEP 0 - TEAMS - ADMIN`, [gen, 'Run once, before the first discipline.']);
    L.push(`$* --- ${newTeams.length} new teams ---`);
    for (const r of newTeams) L.push(`CREATE TEAM ${r.kode} DESC '${r.desc}'`);
    for (const r of newTeams) if ((r.anggota || []).length) { L.push(`SET TEAM ${r.kode}`); for (const u of r.anggota) L.push(`TADD ${u}`); }
    if (out.includeExistingTeamsBlock && oldTeams.length) {
      L.push('$*', '$* --- existing teams: only if they were deleted (normally keep) ---');
      for (const r of oldTeams) L.push(`$* CREATE TEAM ${r.kode} DESC '${r.desc}'`);
      for (const r of oldTeams) if ((r.anggota || []).length) { L.push(`$* SET TEAM ${r.kode}`); for (const u of r.anggota) L.push(`$* TADD ${u}`); }
    }
    add(E.render(cfg, t.teamsFolder, pctx), E.render(cfg, t.teamsFile, pctx), L, 'Admin', '0', `${newTeams.length} CREATE TEAM`);

    if (out.split === 'perStep') {
      const pre = p.filePrefix || '';
      const all = model.disciplines, nDb = model.cells.length;
      L = header(`ALL ROWS - STEP B1 - ADMIN: CREATE ${nDb} DB + MDB`,
        [gen, 'Team must exist (00-TEAMS). If a CREATE line fails: recreate that DB, continue.', 'Rows in order; each block has its own SET MDB.']);
      for (const dd of all) L.push(`$* --- ${dd.row.desc} ---`, ...createLines(cfg, dd), '$*', ...addLines(dd));
      add('B1', `${pre}B1-CREATE-DB-MDB-ADMIN.mac`, L, 'Admin', 'B1', `${nDb} CREATE DB + ADD`);
      L = header(`ALL ROWS - STEP B2 - DESIGN: separators + ${nDb} sites (display order)`,
        [gen, 'DB given once per DB (first site); next lines without DB go to the same DB.', 'Re-enter DESIGN after B1.']);
      const st = { lastDb: null };
      for (const dd of all) L.push(`$* --- ${dd.row.desc} ---`, ...siteLines(dd, st));
      L.push('$*', 'SAVEWORK');
      add('B2', `${pre}B2-SITES-DESIGN.mac`, L, 'Design', 'B2', `${nDb} sites + separators`);
      const withZones = all.filter(dd => dd.cells.some(c => c.zones.length));
      if (withZones.length) {
        L = header('ALL ROWS - STEP B3 - DESIGN: zones',
          [gen, ...(E.FACTS.newZoneTested ? [] : [NEW_ZONE_WARNING]), 'Each block: go to SITE, NEW ZONE.']);
        for (const dd of withZones) L.push(`$* --- ${dd.row.desc} ---`, ...zoneLines(dd));
        L.push('$*', 'SAVEWORK');
        add('B3', `${pre}B3-ZONES-DESIGN.mac`, L, 'Design', 'B3', 'zones');
      }
    } else {
      for (const dd of model.disciplines) {
        const ctx = dd.ctx, cells = dd.cells, name = String(dd.row.desc).toUpperCase();
        const folder = t.discFolder ? E.render(cfg, t.discFolder, ctx) : '';
        const range = `${cells[0].pos}-${cells[cells.length - 1].pos}`;
        L = header(`${name} (${cells[0].team}) - STEP B1 - ADMIN: CREATE ${cells.length} DB + MDB`,
          [gen, 'Team must exist (00-TEAMS). If a CREATE line fails: recreate that DB, continue.', `MDB positions ${range}.`]);
        L.push(...createLines(cfg, dd), '$*', ...addLines(dd));
        add(folder, E.render(cfg, t.b1File, ctx), L, 'Admin', 'B1', `${cells.length} CREATE DB + ADD`);

        L = header(`${name} - STEP B2 - DESIGN: separators + ${cells.length} sites (display order)`,
          [gen, 'DB given once per DB (first site); next lines without DB go to the same DB.', 'Re-enter DESIGN after B1.']);
        L.push(...siteLines(dd, { lastDb: null }), '$*', 'SAVEWORK');
        const nSep = (dd.sepDiscipline ? 1 : 0) + dd.groupSeps.size;
        add(folder, E.render(cfg, t.b2File, ctx), L, 'Design', 'B2', `${nSep} separators + ${cells.length} sites`);

        if (cells.some(c => c.zones.length)) {
          L = header(`${name} - STEP B3 - DESIGN: zones`,
            [gen, ...(E.FACTS.newZoneTested ? [] : [NEW_ZONE_WARNING]), 'Each block: go to SITE, NEW ZONE.']);
          L.push(...zoneLines(dd), '$*', 'SAVEWORK');
          const nz = cells.reduce((n, c) => n + c.zones.length, 0);
          add(folder, E.render(cfg, t.b3File, ctx), L, 'Design', 'B3', `${nz} zones`);
        }
      }
    }

    const refs = d.referenceDbs || [];
    if (out.includeReference && refs.length) {
      L = header('REFERENCE DBs - ADMIN: add to MDB', [gen, 'Run AFTER all disciplines.']);
      L.push(`SET MDB ${comb.mdb}`);
      for (const r of refs) L.push(r.active ? `ADD ${r.db} ${r.pos}` : `$* ADD ${r.db}   <- ${r.note || ''}`);
      add(E.render(cfg, t.refFolder, pctx), E.render(cfg, t.refFile, pctx), L, 'Admin', '90', `${refs.filter(r => r.active).length} ADD`);
    }

    if (out.includeFixup) {
      L = header('MDB FIX-UP - ADMIN: CURRENT db n for all (final order)',
        [gen, 'Use only if the MDB order is wrong.', 'A DB that is not in the MDB stops the macro: ADD it first.']);
      const mdbs = [...new Set([...model.cells.map(c => c.mdb), comb.mdb])];
      for (const m of mdbs) {
        const cells = model.cells.filter(c => c.mdb === m);
        const rs = m === comb.mdb ? refs.filter(r => r.active) : [];
        if (!cells.length && !rs.length) continue;
        L.push(`SET MDB ${m}`, ...cells.map(c => `CURRENT ${c.db} ${c.pos}`), ...rs.map(r => `CURRENT ${r.db} ${r.pos}`));
      }
      add(E.render(cfg, t.fixupFolder, pctx), E.render(cfg, t.fixupFile, pctx), L, 'Admin', '99', 'CURRENT all DBs');
    }
    return files;
  };

  // Every path in the ZIP, in package order (OUTPUT-FORMAT §1).
  E.packageNames = function (cfg, files) {
    const o = cfg.d.output || {}, names = [];
    if (o.includeReadme) names.push('00-README.txt');
    names.push(...files.map(f => f.path));
    if (o.includeRegister) names.push(E.render(cfg, (cfg.d.templates || {}).registerFile, {}));
    if (o.includeConfig) names.push('config.json');
    return names;
  };

  const pad2 = n => String(n).padStart(2, '0');
  E.stamp = date => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;

  E.readme = function (cfg, model, issues, files, date) {
    const p = cfg.d.project || {}, c = E.counts(cfg, model);
    const folders = [...new Set(files.filter(f => /^B[123]$/.test(f.step)).map(f => f.folder))];
    const warn = [];
    if (c.zones && !E.FACTS.newZoneTested) warn.push('B3: NEW ZONE after navigating to a site is not yet tested (facts sec 9).');
    const seen = new Set();
    for (const i of issues.filter(i => i.severity === 'warning' && i.id !== 'V19')) {
      const m = `${i.message} [${i.id}${i.ref && i.ref !== '-' ? ' ' + i.ref.replace('§', 'sec ') : ''}]`;
      if (!seen.has(m)) { seen.add(m); warn.push(m); }
    }
    const shown = warn.slice(0, 40);
    if (warn.length > shown.length) shown.push(`... ${warn.length - shown.length} more (see register sheet Validation)`);
    const widths = [4, 44, 14, 7];
    const row = r => ' ' + r.map((v, i) => (i < widths.length ? String(v).padEnd(widths[i]) : v)).join(' ').trimEnd();
    const L = [
      `${p.code} (${p.name}) - E3D SETUP PACKAGE`,
      `Generated ${E.stamp(date)} by E3D Setup Generator. Target: ${p.target}.`,
      '',
      'PREPARATION (Admin, SYSTEM)',
      ' - Delete old DBs of this setup if re-running. Check the MDB is empty and no old DB files remain.',
      ' - Nobody else logged in to the project.',
      '',
      'STEPS (command macros only)',
      ' 00-TEAMS -> per row: B1 (Admin) -> re-enter DESIGN -> B2 sites (Design) -> B3 zones (Design)',
      ` Rows in order: ${folders.join(', ')}`,
      ' Then 90-REFERENCE (Admin). 99-FIXUP only if the MDB order is wrong.',
      '',
      'RUN ORDER',
      row(['Step', 'What', 'File', 'Module', 'Check']),
      ...E.RUN_ORDER.map(row),
      '',
      'WARNINGS',
      ...(shown.length ? shown.map(w => ` - ${w}`) : [' - none']),
      '',
      'KNOWN ISSUE',
      ...E.KNOWN_ISSUE.map(s => ' ' + s),
      '',
      'COUNTS',
      ` Teams new/existing: ${c.teamsNew}/${c.teamsExisting}  DBs: ${c.dbs}  Sites: ${c.sites}  Separators: ${c.separators}  Zones: ${c.zones}  Reference DBs: ${c.refsActive}`,
    ];
    return join(L.map(s => s.replace(/[^\x00-\x7F]/g, '?')), E.eol(cfg));
  };
})(E3D);

/* ---- src/engine/validate.js ---- */
/* Validation V01-V24 (docs/RULES.md §3). Each issue: {id, severity, ref, message, location}.
   location.screen: 1 Project, 2 Attribute, 3 Relasi & kombinasi, 4 Template, 5 Preview, 6 Generate. */
(function (E) {
  'use strict';

  const ID_RE = /^[a-z][a-z0-9_]*$/, NAME_RE = /^[A-Za-z][A-Za-z0-9_]*$/, COL_RE = /^[a-zA-Z][a-zA-Z0-9_]*$/;
  const empty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);

  E.validate = function (cfg, model, files) {
    const issues = [], d = cfg.d;
    const add = (id, severity, ref, message, location) => issues.push({ id, severity, ref, message, location: location || {} });
    const cellLoc = (c, extra) => Object.assign({ screen: 3, cell: [c.rowKode, c.colKode] }, extra);

    /* V02: attribute structure */
    const names = new Map(), ids = new Map();
    const roleCount = { team: 0, user: 0 };
    for (const a of d.attributes || []) {
      const loc = { screen: 2, attributeId: a.id };
      if (!ID_RE.test(a.id || '')) add('V02', 'error', '-', `Id attribute (${a.id}) harus [a-z][a-z0-9_]*`, loc);
      if (ids.has(a.id)) add('V02', 'error', '-', `Id attribute (${a.id}) duplikat`, loc);
      ids.set(a.id, a);
      if (!NAME_RE.test(a.name || '')) add('V02', 'error', '-', `Nama attribute (${a.name}) harus [A-Za-z][A-Za-z0-9_]* (tanpa spasi)`, loc);
      if (E.RESERVED_HEADS.includes(a.name)) add('V02', 'error', '-', `Nama attribute (${a.name}) dipakai oleh token sistem`, loc);
      if (names.has(a.name)) add('V02', 'error', '-', `Nama attribute (${a.name}) duplikat`, loc);
      names.set(a.name, a);
      if (a.role in roleCount && ++roleCount[a.role] === 2) add('V02', 'error', '-', `Lebih dari satu attribute berperan ${a.role}`, loc);
      const colIds = new Set();
      for (const c of a.columns || []) {
        const cl = Object.assign({ column: c.id }, loc);
        if (!COL_RE.test(c.id || '')) add('V02', 'error', '-', `Id kolom (${a.name}.${c.id}) tidak valid`, cl);
        if (colIds.has(c.id)) add('V02', 'error', '-', `Id kolom (${a.name}.${c.id}) duplikat`, cl);
        colIds.add(c.id);
        if ((c.type === 'ref' || c.type === 'refList') && !cfg.attrs[c.target])
          add('V02', 'error', '-', `Kolom ${a.name}.${c.id} menunjuk attribute (${c.target}) yang tidak ada`, cl);
      }
      for (const k of ['kode', 'desc']) if (!colIds.has(k)) add('V02', 'error', '-', `Attribute ${a.name} wajib punya kolom ${k}`, loc);
    }
    const { rowAttr, colAttr } = E.roles(cfg);
    const comb = d.combination || {};
    if (!rowAttr) add('V02', 'error', '-', `Attribute baris (${comb.rowAttr || '-'}) belum dipilih atau tidak ada`, { screen: 3 });
    if (!colAttr) add('V02', 'error', '-', `Attribute kolom (${comb.colAttr || '-'}) belum dipilih atau tidak ada`, { screen: 3 });
    if (colAttr && comb.groupBy) {
      const gc = cfg.col(colAttr.id, comb.groupBy);
      if (!gc || gc.type !== 'ref') add('V02', 'error', '-', `Grup kolom (${comb.groupBy}) harus kolom referensi di ${colAttr.name}`, { screen: 3 });
    }
    if (rowAttr && !cfg.col(rowAttr.id, 'urutan')) add('V02', 'error', '-', `Attribute baris ${rowAttr.name} perlu kolom angka 'urutan'`, { screen: 2, attributeId: rowAttr.id });

    /* V01: attribute data */
    for (const a of d.attributes || []) {
      const seen = new Set();
      (a.rows || []).forEach((r, i) => {
        const key = r.kode, rl = col => ({ screen: 2, attributeId: a.id, rowKode: key, rowIndex: i, column: col });
        if (!empty(r.kode) && seen.has(r.kode)) add('V01', 'error', '-', `Kode ${r.kode} (${a.name}) duplikat`, rl('kode'));
        seen.add(r.kode);
        for (const c of a.columns || []) {
          const v = r[c.id], what = `${c.name || c.id} (${a.name}, ${key || '#' + (i + 1)})`;
          if (empty(v)) {
            if (c.required || c.id === 'kode' || c.id === 'desc') add('V01', 'error', '-', `${what} wajib diisi`, rl(c.id));
            continue;
          }
          if (c.type === 'number' && !Number.isInteger(v)) add('V01', 'error', '-', `${what} harus bilangan bulat (${v})`, rl(c.id));
          if (c.type === 'boolean' && typeof v !== 'boolean') add('V01', 'error', '-', `${what} harus ya/tidak`, rl(c.id));
          if (c.type === 'text' && typeof v !== 'string') add('V01', 'error', '-', `${what} harus teks`, rl(c.id));
          if ((c.type === 'ref' || c.type === 'refList') && cfg.rows[c.target]) {
            const tname = cfg.attrs[c.target].name;
            for (const x of c.type === 'ref' ? [v] : (Array.isArray(v) ? v : [v]))
              if (!cfg.rows[c.target].has(x)) add('V01', 'error', '-', `${what}: ${x} tidak ada di ${tname}`, rl(c.id));
          }
        }
        if (a.role === 'team' && String(r.desc || '').includes("'"))
          add('V01', 'error', '-', `Deskripsi team ${key} mengandung tanda kutip '`, rl('desc'));
      });
    }

    /* V03: template tokens resolve in their context */
    const t = d.templates || {};
    for (const [key, kind] of Object.entries(E.TEMPLATE_KINDS)) {
      if (empty(t[key])) {
        if (!E.OPTIONAL_TEMPLATES.includes(key)) add('V03', 'error', '-', `Template ${key} kosong`, { screen: 4, template: key });
        continue;
      }
      for (const m of E.checkTemplate(cfg, t[key], E.contextHeads(cfg, kind)))
        add('V03', 'error', '-', `Template ${key}: ${m}`, { screen: 4, template: key });
    }
    for (const [i, rule] of (d.zoneRules || []).entries()) {
      const loc = { screen: 4, zoneRule: i };
      if (rule.forEach && !cfg.attrs[rule.forEach]) add('V03', 'error', '-', `Aturan zone ${rule.id}: attribute forEach (${rule.forEach}) tidak ada`, loc);
      const heads = E.contextHeads(cfg, 'zone', rule.forEach);
      for (const p of rule.patterns || []) for (const m of E.checkTemplate(cfg, p, heads)) add('V03', 'error', '-', `Aturan zone ${rule.id}: ${m}`, loc);
      for (const w of rule.when || []) for (const m of E.checkTemplate(cfg, `{${w.token}}`, E.contextHeads(cfg, 'cell').concat('SITE')))
        add('V03', 'error', '-', `Aturan zone ${rule.id}, syarat: ${m}`, loc);
    }
    if (comb.mode === 'condition')
      for (const w of comb.condition || []) for (const m of E.checkTemplate(cfg, `{${w.token}}`, E.contextHeads(cfg, 'condition')))
        add('V03', 'error', '-', `Kondisi kombinasi: ${m}`, { screen: 3 });

    /* V04: expressions */
    const exprSeen = new Set();
    for (const x of model.exprErrors) {
      const k = x.template + x.message;
      if (exprSeen.has(k)) continue;
      exprSeen.add(k);
      add('V04', 'error', '-', `${x.template} (${x.cell.rowKode} x ${x.cell.colKode}): ${x.message}`, { screen: 4, template: x.template, cell: [x.cell.rowKode, x.cell.colKode] });
    }

    /* V11 */
    const def = d.dbDefaults || {};
    if (def.access === 'MULTIWRITE' && !E.MULTIWRITE_TYPES.includes(def.type))
      add('V11', 'error', '1.4', `Type ${def.type} tidak bisa MULTIWRITE (hanya DESI, CATA, DRAFT, ISODRAFT)`, { screen: 1, field: 'dbDefaults' });

    /* V05-V08: DBs */
    const teamAttr = cfg.role('team')[0];
    const teams = teamAttr ? cfg.rows[teamAttr.id] : new Map();
    const inUse = d.inUse || null;
    const usedNo = new Map(), usedName = new Set();
    for (const x of (inUse && inUse.dbs) || []) {
      if (x.number !== null && x.number !== undefined) usedNo.set(x.number, `${x.name} (project)`);
      usedName.add(x.name);
    }
    const seenNo = new Map(), seenDb = new Set();
    for (const c of model.cells) {
      const loc = cellLoc(c);
      if (c.team === null) add('V05', 'error', '1.1, 1.12', `Nama DB (${c.db}) harus TEAM/NAMA`, { screen: 4, template: 'dbName' });
      else if (!teams.has(c.team)) add('V05', 'error', '1.1, 1.12', `Team pemilik ${c.team} (${c.db}) tidak ada di tabel Team`, { screen: 4, template: 'dbName', cell: loc.cell });
      const n = c.dbno;
      if (n !== null) {
        if (!((n >= 1 && n <= 7000) || (n >= 10000 && n <= 250000)))
          add('V06', 'error', '1.3', `DBNO ${n} (${c.db}) di luar 1-7000 / 10000-250000`, Object.assign(loc, { screen: 4, template: 'dbNo' }));
        const prev = seenNo.get(n) || usedNo.get(n);
        if (prev) add('V07', 'error', '1.3', `DBNO ${n} (${c.db}) sudah dipakai oleh ${prev}`, cellLoc(c, { screen: 4, template: 'dbNo' }));
        seenNo.set(n, c.db);
      }
      if (seenDb.has(c.db)) add('V08', 'error', '1.1', `Nama DB ${c.db} duplikat`, cellLoc(c, { screen: 4, template: 'dbName' }));
      else if (usedName.has(c.db)) add('V08', 'error', '1.1', `Nama DB ${c.db} sudah ada di project (Export Config)`, cellLoc(c, { screen: 4, template: 'dbName' }));
      seenDb.add(c.db);

    const perMdb = new Map();
    const push = (m, pos, db, loc) => { if (!perMdb.has(m)) perMdb.set(m, []); perMdb.get(m).push({ pos, db, loc }); };
    for (const c of model.cells) push(c.mdb, c.pos, c.db, cellLoc(c, { screen: 4, template: 'mdbPos' }));

        if (!(Number.isInteger(x.pos) && x.pos >= 1 && x.pos <= 5000)) add('V09', 'error', '§2', `Posisi MDB ${x.pos} (${x.db}) di luar 1-5000`, x.loc);
        if (seen.has(x.pos)) add('V09', 'error', '§2', `Posisi MDB ${x.pos} (${x.db}) sudah dipakai oleh ${seen.get(x.pos)} di ${m}`, x.loc);

      if (order.length && order[0].kind !== 'site' && order[0].db !== dd.cells[0].db)
        add('V24', 'error', '3.2, 3.3', `Separator ${order[0].name} dibuat sebelum site DB-nya`, { screen: 3, order: dd.row.kode });

      for (const c of dd.cells) c.zones.forEach((z, i) => elems.push({ name: z, loc: { screen: 4, zoneRuleId: c.zoneRules[i] } }));

        if (nonAscii.has(bad)) return;
        nonAscii.add(bad);

    for (const dd of model.disciplines)
      if (!dd.cells.some(c => c.targeted))
        add('V20', 'warning', '-', `Tidak ada aturan zone yang menargetkan baris ${dd.row.kode} (${dd.row.desc})`, { screen: 4, field: 'zoneRules' });

(function (E) {

      [12, 40, 8, 40, 9]);

      const hit = book.map(sh => ({ sh, list: E.readDbListSheet(sh) })).find(x => x.list);

/* Minimal ZIP writer/reader. Deflate via CompressionStream('deflate-raw') when the browser has it,
   otherwise entries are stored uncompressed (still a valid ZIP). No third-party code. */
(function (E) {
  'use strict';

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  const crc32 = bytes => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  const enc = new TextEncoder();
  const toBytes = d => (typeof d === 'string' ? enc.encode(d) : d instanceof Uint8Array ? d : new Uint8Array(d));

  async function pipe(bytes, stream) {
    const s = new Blob([bytes]).stream().pipeThrough(stream);

  function dosTime(date) {
    return {
      time: (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1),
      date: ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
    };
  }

  async function write(entries, opts) {
    const now = dosTime((opts && opts.date) || new Date());

      const name = enc.encode(e.path), raw = toBytes(e.data), crc = crc32(raw);
      let method = 0, body = raw;

          const z = await pipe(raw, new CompressionStream('deflate-raw'));
          if (z.length < raw.length) { method = 8; body = z; }

      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, method, true); lh.setUint16(10, now.time, true); lh.setUint16(12, now.date, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, body.length, true); lh.setUint32(22, raw.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);

      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, method, true); ch.setUint16(12, now.time, true); ch.setUint16(14, now.date, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, body.length, true); ch.setUint32(24, raw.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + body.length;
    }
    const cdSize = central.reduce((n, p) => n + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);

    for (let i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }

        const ref = colName(ci) + (ri + 1), s = ri === 0 ? ' s="1"' : '';
        if (v === null || v === undefined || v === '') return ri === 0 ? `<c r="${ref}"${s}/>` : '';
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
        return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${ri + 1}">${cells}</row>`;

      ? `<cols>${sheet.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';

      ? '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews>'
      : '<sheetViews><sheetView workbookViewId="0"/></sheetViews>';

      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +

      `<Relationship Id="rId3" Type="${RNS}/extended-properties" Target="docProps/app.xml"/></Relationships>` });

      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +

  let tourI = -1;

  U.act.tour = () => { if (!A.ui.screen) A.ui.screen = 1; U.renderAll(); U.startTour(); };
  function endTour() { tourI = -1; const t = U.$('#tour'); if (t) t.remove(); U.store.set(U.KEY + '/tour', 1); }
  function drawTour() {
    let t = U.$('#tour');
    if (tourI < 0 || tourI >= TOUR.length) return endTour();
    const [sel, title, text] = TOUR[tourI];
    const target = U.$(sel);
    if (!target) { tourI++; return drawTour(); }
    if (!t) { t = document.createElement('div'); t.id = 'tour'; document.body.appendChild(t); }
    const r = target.getBoundingClientRect();

      <dt>Posisi MDB</dt><dd>Angka n pada ADD db n. Menentukan urutan di MDB (fakta 1.9), 1–5000.</dd>
      <dt>Zone</dt><dd>Dibuat di tiap site menurut aturan zone. NEW ZONE setelah pindah ke site belum dites (§9).</dd>
      <dt>Project tujuan</dt><dd>Export Config (.xlsx) dari project E3D tempat paket dijalankan, untuk cek nama team, DB dan DBNO yang sudah dipakai.</dd>

/* ---- src/ui/importer.js ---- */
/* Table import (Excel .xlsx, CSV, pasted cells) into a list, with drag-and-drop column mapping. */
(function (U) {
  'use strict';
  const E = E3D, A = U.App, esc = U.esc;

  // Pseudo-list for reference DBs (step 90) so the same importer handles them.
  U.REFS_LIST = {
    id: 'refs', name: 'DB referensi',
    columns: [{ id: 'db', name: 'DB', type: 'text' }, { id: 'pos', name: 'Posisi MDB', type: 'number' },
      { id: 'active', name: 'Aktif', type: 'boolean' }, { id: 'note', name: 'Catatan', type: 'text' }],
  };
  const listById = id => (id === 'refs' ? U.REFS_LIST : A.attr(id));
  const cellText = v => (v === undefined || v === null ? '' : String(v));

  async function pickSheet(book, name) {
    const sheets = book.filter(s => s.rows.some(r => r.some(c => cellText(c).trim())));
    if (!sheets.length) { U.toast(`${name}: tidak ada data`, 'error'); return null; }
    if (sheets.length === 1) return sheets[0];
    const res = await U.dialog({
      title: 'Sheet mana?',
      body: `<div class="opts">${sheets.map((s, i) => `<label><input type="radio" name="sh" value="${i}" ${i === 0 ? 'checked' : ''}><span>${esc(s.name)} <small>${s.rows.length} baris</small></span></label>`).join('')}</div>`,
      actions: [{ label: 'Batal', value: null }, { label: 'Pilih', value: 'ok', kind: 'filled' }],
      collect: d => +U.$('input[name=sh]:checked', d).value,
    });
    return res ? sheets[res.data] : null;
  }

  U.importTable = async function (src, listId) {
    let table;
    if (src.book) {
      const sh = await pickSheet(src.book, src.name);
      if (!sh) return;
      table = sh.rows.map(r => r.map(cellText));
    } else table = E.parseDelimited(src.text, E.detectDelimiter(src.text));
    table = table.filter(r => r.some(c => c.trim() !== ''));
    if (!table.length) return U.toast('Tidak ada baris yang terbaca', 'error');
    const width = Math.max(...table.map(r => r.length));
    const st = { list: listId || (A.ui.screen === 1 && A.ui.list) || (A.config.combination || {}).colAttr || (A.config.attributes[0] || {}).id };
    const initMap = () => { const l = listById(st.list); st.header = E.looksLikeHeader(l, table[0], table.slice(1)); st.map = E.guessMapping(l, st.header ? table[0] : Array.from({ length: width }, (_, j) => j), st.header); };
    initMap();
    const srcName = j => (st.header ? cellText(table[0][j]) || `Kolom ${j + 1}` : `Kolom ${j + 1}`);
    const body = () => (st.header ? table.slice(1) : table);

    function draw(d) {
      const l = listById(st.list), used = new Set(Object.values(st.map).filter(j => j >= 0));
      const rows = E.mapTable(l, body().slice(0, 5), st.map);
      U.$('.imp', d).innerHTML = `
        <div class="inline"><label for="impList">Ke daftar</label>
          <select id="impList" class="input" style="width:auto">${(A.config.attributes || []).map(a => `<option value="${esc(a.id)}" ${a.id === st.list ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}<option value="refs" ${st.list === 'refs' ? 'selected' : ''}>DB referensi</option></select>
          <label class="inline nowrap"><input type="checkbox" id="impHdr" ${st.header ? 'checked' : ''}>Baris pertama = judul</label></div>
        <div class="map">
          <div class="map-dst">${l.columns.map(c => {
            const j = st.map[c.id];
            return `<div class="map-row"><span>${esc(c.name || c.id)}</span><span class="arrow">←</span>
              <div class="slot${j >= 0 ? ' filled' : ''}" data-slot="${esc(c.id)}">${j >= 0 ? `<span class="srcchip" draggable="true" data-src="${j}">${esc(srcName(j))}</span>` : 'seret ke sini'}</div>
              <select class="input mini" data-pick="${esc(c.id)}" aria-label="Kolom file untuk ${esc(c.name || c.id)}"><option value="-1">—</option>${Array.from({ length: width }, (_, k) => `<option value="${k}" ${k === j ? 'selected' : ''}>${esc(srcName(k))}</option>`).join('')}</select></div>`;
          }).join('')}</div>
          <div class="map-src"><span class="hint">Kolom file</span><div class="chips">${Array.from({ length: width }, (_, k) => `<span class="srcchip${used.has(k) ? ' used' : ''}" draggable="true" data-src="${k}">${esc(srcName(k))}</span>`).join('')}</div></div>
        </div>
        <div class="tbl"><table><thead><tr>${l.columns.map(c => `<th>${esc(c.name || c.id)}</th>`).join('')}</tr></thead><tbody>
          ${rows.map(r => `<tr>${l.columns.map(c => `<td class="mono">${esc(Array.isArray(r[c.id]) ? r[c.id].join(', ') : typeof r[c.id] === 'boolean' ? (r[c.id] ? 'ya' : '') : r[c.id] === null ? '' : r[c.id])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <span class="hint">${body().length} baris${body().length > 5 ? ' · 5 pertama ditampilkan' : ''}</span>`;
      const count = U.$('button.filled', d);
      if (count) count.textContent = `Impor ${body().length} baris`;
    }

    const res = await U.dialog({
      title: `Impor ${src.name}`, wide: true,
      body: `<div class="imp stack"></div>
        <div class="opts row-opts"><label><input type="radio" name="im" value="append" checked><span>Tambah</span></label>
          <label><input type="radio" name="im" value="merge"><span>Gabung (kode sama diperbarui)</span></label>
          <label><input type="radio" name="im" value="replace"><span>Ganti semua</span></label></div>`,
      actions: [{ label: 'Batal', value: null }, { label: 'Impor', value: 'ok', kind: 'filled' }],
      collect: d => U.$('input[name=im]:checked', d).value,
      onOpen: d => {
        draw(d);
        const box = U.$('.imp', d);
        box.addEventListener('change', ev => {
          if (ev.target.id === 'impList') { st.list = ev.target.value; initMap(); }
          else if (ev.target.id === 'impHdr') { st.header = ev.target.checked; st.map = E.guessMapping(listById(st.list), st.header ? table[0] : Array.from({ length: width }, (_, j) => j), st.header); }
          else if (ev.target.dataset.pick) st.map[ev.target.dataset.pick] = +ev.target.value;
          draw(d);
        });
        let dragSrc = null;
        box.addEventListener('dragstart', ev => { const c = ev.target.closest('[data-src]'); if (c) { dragSrc = +c.dataset.src; ev.dataTransfer.setData('text/plain', 'col'); } });
        box.addEventListener('dragover', ev => { const s = ev.target.closest('[data-slot]'); if (s && dragSrc !== null) { ev.preventDefault(); s.classList.add('over'); } });
        box.addEventListener('dragleave', ev => { const s = ev.target.closest('[data-slot]'); if (s) s.classList.remove('over'); });
        box.addEventListener('drop', ev => {
          const s = ev.target.closest('[data-slot]');
          if (!s || dragSrc === null) return;
          ev.preventDefault(); ev.stopPropagation();
          for (const k of Object.keys(st.map)) if (st.map[k] === dragSrc) st.map[k] = -1;
          st.map[s.dataset.slot] = dragSrc;
          dragSrc = null;
          draw(d);
        });
        box.addEventListener('dragend', () => { dragSrc = null; });
      },
    });
    if (!res) return;
    const l = listById(st.list);
    let rows = E.mapTable(l, body(), st.map);
    if (st.list === 'refs') {
      rows = rows.filter(r => r.db).map(r => ({ db: r.db, pos: r.pos, active: st.map.active >= 0 ? r.active : true, note: r.note || '' }));
      A.mutate(c => {
        if (res.data === 'replace') c.referenceDbs = rows;
        else for (const r of rows) { const old = c.referenceDbs.find(x => x.db === r.db); if (old && res.data === 'merge') Object.assign(old, r); else c.referenceDbs.push(r); }
      });
    } else {
      A.mutate(c => {
        const at = c.attributes.find(a => a.id === st.list);
        if (res.data === 'replace') at.rows = rows;
        else for (const r of rows) { const old = res.data === 'merge' && at.rows.find(x => x.kode === r.kode); if (old) Object.assign(old, r); else at.rows.push(r); }
      });
    }
    A.ui.list = st.list;
    if (A.ui.screen !== 1) U.go(1); else U.renderAll();
    U.toast(`${rows.length} baris diimpor ke ${l.name}`);
  };
})(UI);

/* ---- src/ui/blocks.js ---- */
/* Block builder: a template string shown as draggable blocks (list value, text, number, operator).
   Names concatenate blocks; expressions (DBNO, MDB position) join them with spaces. */
(function (U) {
  'use strict';
  const E = E3D, A = U.App, esc = U.esc;
  const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷', '(': '(', ')': ')' };

  // Token paths available for the given heads (one level through reference columns).
  U.tokenPaths = function (heads) {
    const out = [];
    for (const h of heads) {
      if (h === 'PROJECT') { out.push('PROJECT.code', 'PROJECT.filePrefix', 'PROJECT.name'); continue; }
      if (h === 'SITE' || h === 'INDEX') { out.push(h); continue; }
      const a = A.config.attributes.find(x => x.name === h);
      if (!a) continue;
      for (const c of a.columns || []) {
        if (c.type === 'boolean' || c.type === 'refList') continue;
        if (c.type === 'ref') {
          const t = A.attr(c.target);
          if (t) for (const tc of t.columns || []) if (tc.type !== 'boolean' && tc.type !== 'refList' && tc.type !== 'ref') out.push(`${h}.${c.id}.${tc.id}`);
        } else out.push(`${h}.${c.id}`);
      }
    }
    return out;
  };

      return LADDER.map(([k, label]) => {
        const keys = k === 'zone' ? (A.config.zoneRules || []).map((r, i) => 'z:' + i).concat('f:zoneRules') : ['t:' + k];
        const bad = keys.some(x => U.issuesAt(x, 'error').length);
        return `<button type="button" class="rung" role="tab" data-act="nameSel" data-k="${k}" aria-selected="${A.ui.name === k}">
          <span>${label}${bad ? '<span class="dot err"></span>' : ''}</span><code>${esc(sample(A, k))}</code></button>`;
      }).join('');
    },
    out: A => `<span class="big-out">${esc(sample(A, A.ui.name))}</span>`,
    ex: A => `${examples(A, A.ui.name)}<span class="muted">${esc(stats(A, A.ui.name))}</span>`,
    range: A => (E.EXPRESSION_TEMPLATES.includes(A.ui.name) ? rangeLine(A, A.ui.name) : ''),
    probs: A => U.problems('t:' + A.ui.name),
    zprobs(A) {
      const keys = ['f:zoneRules'].concat((A.config.zoneRules || []).map((r, i) => 'z:' + i));
      const v19 = A.r.issues.some(i => i.id === 'V19');
      const errs = keys.flatMap(k => U.issuesAt(k, 'error'));
      return (v19 ? `<span class="chip warn">${U.icon('warning')}NEW ZONE setelah pindah ke site belum dites; B3 tetap dibuat dengan peringatan<span class="ref">§9</span></span>` : '') +
        [...new Map(errs.map(i => [i.message, i])).values()].slice(0, 4).map(i => `<span class="chip err">${U.icon('error')}${esc(i.message)}</span>`).join('');
    },
    cover(A) {
      const ds = A.r.model.disciplines;
      return ds.map(d => { const on = d.cells.some(c => c.targeted); return `<span class="cov${on ? ' on' : ''}" title="${esc(d.row.desc)}${on ? '' : ': belum ada aturan zone'}">${esc(d.row.kode)}</span>`; }).join('');
    },
  };
  (A => { for (let i = 0; i < 50; i++) parts['zs' + i] = A => ruleSample(A, i); })();

  function templateEditor(A, key) {
    const meta = LADDER.find(l => l[0] === key);
    const kind = E.EXPRESSION_TEMPLATES.includes(key) ? 'expr' : 'name';
    const ctx = ctxFor(A, key);
    const optional = E.OPTIONAL_TEMPLATES.includes(key);
    const on = !!A.config.templates[key];
    const roles = E.roles(A.r.cfg);
    const groupOff = key === 'sepGroup' && !(roles.groupAttr && roles.groupAttr.role === 'separator');
    return `<section class="card" data-loc="t:${key}">
      <div class="card-head"><div><h2>${meta[1]}</h2><span class="hint">${meta[2]}</span></div>
        ${optional ? `<label class="switch"><input type="checkbox" data-change="sepToggle" data-k="${key}" ${on ? 'checked' : ''}><span>Pakai</span></label>` : ''}</div>
      ${groupOff ? `<div class="note">Grup belum diberi separator. Aktifkan "dengan separator" di <button type="button" class="link" data-act="go" data-screen="2">Susunan</button>.</div>` : ''}
      ${optional && !on ? '' : `
        <div data-part="out">${parts.out(A)}</div>
        ${U.blockBar('templates.' + key, kind, ctx)}
        <div data-part="range">${parts.range(A)}</div>
        <div class="examples" data-part="ex">${parts.ex(A)}</div>
        <div class="chips" data-part="probs">${parts.probs(A)}</div>
        <div class="pal-head">Blok</div>${U.blockPalette('templates.' + key, kind, E.contextHeads(A.r.cfg, E.TEMPLATE_KINDS[key]), ctx, key === 'dbDesc' || key === 'sepDiscipline' ? 'desc' : null)}`}
    </section>`;
  }

  /* ---------- Zone rules ---------- */
  function valueList(A, token) {
    const head = String(token).split('.');
    const a = A.config.attributes.find(x => x.name === head[0]);
    if (!a) return [];
    let at = a;
    for (let i = 1; i < head.length - 1; i++) { const c = at.columns.find(x => x.id === head[i]); if (!c || c.type !== 'ref') return []; at = A.attr(c.target); if (!at) return []; }
    const col = head[head.length - 1];
    return [...new Set(at.rows.map(r => r[col]).filter(v => v !== undefined && v !== null && v !== ''))].slice(0, 200);
  }
  U.clauseEditor = function (base, clauses, tokens, idp) {
    return `<div class="clauses">${(clauses || []).map((w, k) => {
      const vals = valueList(A, w.token);
      const opts = tokens.includes(w.token) || !w.token ? tokens : [w.token].concat(tokens);
      return `<div class="clause">
        <select class="input" data-bind="${base}.${k}.token" aria-label="Kolom">${!w.token ? '<option value="">pilih…</option>' : ''}${opts.map(t => { const [h, c] = U.tokenLabel(t); return `<option value="${esc(t)}" ${t === w.token ? 'selected' : ''}>${esc(h)}${c ? ' · ' + esc(c) : ''}</option>`; }).join('')}</select>
        <select class="input op" data-change="clauseOp" data-path="${base}.${k}" aria-label="Operator">${OPS.map(([v, l]) => `<option value="${v}" ${w.op === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <input class="input mono" data-bind="${base}.${k}.value" ${w.op === 'in' ? 'data-t="list"' : ''} value="${esc(Array.isArray(w.value) ? w.value.join(', ') : w.value)}" list="${idp}-${k}" placeholder="${w.op === 'in' ? 'A, B' : 'nilai'}" aria-label="Nilai" spellcheck="false">
        <datalist id="${idp}-${k}">${vals.map(v => `<option value="${esc(v)}">`).join('')}</datalist>
        <button class="icon-btn sm danger" type="button" data-act="clauseDel" data-path="${base}" data-k="${k}" aria-label="Hapus syarat">${U.icon('close')}</button></div>`;
    }).join('')}
    <button class="btn sm text" type="button" data-act="clauseAdd" data-path="${base}">${U.icon('add')}Syarat</button></div>`;
  };
  U.act.clauseOp = el => A.mutate(c => {
    const w = U.getPath(c, el.dataset.path);
    w.op = el.value;
    if (w.op === 'in' && !Array.isArray(w.value)) w.value = String(w.value || '').split(/[,;\s]+/).filter(Boolean);
    if (w.op !== 'in' && Array.isArray(w.value)) w.value = w.value.join(',');
  });
  U.act.clauseAdd = el => A.mutate(c => {
    const list = U.getPath(c, el.dataset.path);
    if (Array.isArray(list)) list.push({ token: '', op: 'eq', value: '' }); else U.setPath(c, el.dataset.path, [{ token: '', op: 'eq', value: '' }]);
  });
  U.act.clauseDel = el => A.mutate(c => U.getPath(c, el.dataset.path).splice(+el.dataset.k, 1));

  function ruleSample(A, i) {
    const rule = (A.config.zoneRules || [])[i];
    if (!rule) return '';
    let n = 0, sites = 0;
    const ex = [];
    for (const c of A.r.model.cells) {
      let hit = false;
      c.zoneRules.forEach((id, k) => { if (id === rule.id) { n++; hit = true; if (ex.length < 3) ex.push(c.zones[k]); } });
      if (hit) sites++;
    }
    return `${ex.map(z => `<span>${esc(z)}</span>`).join('')}<span class="muted">${n ? `${U.num(n)} zone di ${U.num(sites)} site` : 'belum menghasilkan zone'}</span>`;
  }
  function zoneEditor(A) {
    const zr = A.config.zoneRules || [];
    const condTokens = U.tokenPaths(E.contextHeads(A.r.cfg, 'cell').filter(h => h !== 'INDEX' && h !== 'PROJECT'));
    const pal = (() => {
      const lb = U.lastBlock && /^zoneRules\.(\d+)\./.exec(U.lastBlock.path);
      const i = lb ? +lb[1] : 0, rule = zr[i];
      return rule ? U.blockPalette('zoneRules.*', 'name', E.contextHeads(A.r.cfg, 'zone', rule.forEach), ctxFor(A, 'zone', rule)) : '';
    })();
    return `<section class="card" data-loc="f:zoneRules">
      <div class="card-head"><div><h2>Zone</h2><span class="hint">Aturan dicek per site, berurutan.</span></div>
        <div class="cover" data-part="cover" title="Baris yang sudah punya aturan zone">${parts.cover(A)}</div></div>
      <div class="chips" data-part="zprobs">${parts.zprobs(A)}</div>
      <div class="rules" id="rules">${zr.map((r, i) => `
        <div class="rule" data-loc="z:${i}" data-rule="${i}">
          <div class="rule-head"><span class="grip" draggable="true" title="Seret untuk mengurutkan (Alt+↑/↓)" tabindex="0" data-grip="${i}">${U.icon('drag', 'sm')}</span>
            <input class="input mono rid" data-bind="zoneRules.${i}.id" value="${esc(r.id)}" aria-label="Nama aturan" spellcheck="false">
            <span class="spacer"></span>
            <button type="button" class="icon-btn sm danger" data-act="ruleDel" data-i="${i}" aria-label="Hapus aturan">${U.icon('delete')}</button></div>
          <div class="rule-body">
            <div class="lbl">Jika</div>${U.clauseEditor(`zoneRules.${i}.when`, r.when || [], condTokens, 'zv' + i)}
            <div class="lbl">Untuk tiap</div><div><select class="input auto" data-change="ruleForEach" data-i="${i}" aria-label="Untuk tiap"><option value="">— satu kali per site</option>${U.attrOptions(r.forEach)}</select></div>
            <div class="lbl">Nama</div><div class="stack">${(r.patterns || []).map((p, k) => `<div class="inline nowrap"><div class="grow">${U.blockBar(`zoneRules.${i}.patterns.${k}`, 'name', ctxFor(A, 'zone', r))}</div>
                <button class="icon-btn sm danger" type="button" data-act="patDel" data-i="${i}" data-k="${k}" aria-label="Hapus pola">${U.icon('close')}</button></div>`).join('')}
              <button class="btn sm text" type="button" data-act="patAdd" data-i="${i}">${U.icon('add')}Nama zone</button></div>
            <div class="lbl"></div><div class="examples" data-part="zs${i}">${ruleSample(A, i)}</div>
          </div></div>`).join('') || '<div class="empty">Belum ada aturan. Tanpa aturan, file B3 (zone) tidak dibuat.</div>'}</div>
      <button class="btn sm tonal" type="button" data-act="ruleAdd" style="align-self:flex-start">${U.icon('add')}Aturan zone</button>
      ${zr.length ? `<div class="pal-head">Blok</div>${pal}` : ''}
    </section>`;
  }

  U.screens[3] = {
    parts,
    select(A, loc) {
      if (loc.template && LADDER.some(l => l[0] === loc.template)) A.ui.name = loc.template;
      else if (loc.zoneRule !== undefined || loc.zoneRuleId || loc.field === 'zoneRules') A.ui.name = 'zone';
    },
    render(A) {
      if (!LADDER.some(l => l[0] === A.ui.name)) A.ui.name = 'site';
      return `<div class="page names">
        <nav class="card ladder" role="tablist" aria-label="Nama di E3D"><h2>Nama di E3D</h2><div data-part="ladder">${parts.ladder(A)}</div>
          <span class="hint">File &amp; folder paket: ⚙ di Cek &amp; Unduh</span></nav>
        <div class="editor">${A.ui.name === 'zone' ? zoneEditor(A) : templateEditor(A, A.ui.name)}</div></div>`;
    },
    mount(root) {
      const rules = U.$('#rules', root);
      if (!rules) return;
      let drag = null;
      rules.addEventListener('dragstart', ev => { const g = ev.target.closest('[data-grip]'); if (g) { drag = +g.dataset.grip; ev.dataTransfer.setData('text/plain', 'rule'); } });
      rules.addEventListener('dragover', ev => { if (drag === null) return; const r = ev.target.closest('.rule'); if (r) { ev.preventDefault(); U.$$('.rule.before', rules).forEach(x => x.classList.remove('before')); r.classList.add('before'); } });
      rules.addEventListener('drop', ev => {
        if (drag === null) return;
        const r = ev.target.closest('.rule');
        ev.preventDefault(); ev.stopPropagation();
        const from = drag; drag = null;
        if (!r) return;
        const to = +r.dataset.rule;
        if (to !== from) A.mutate(c => { const [x] = c.zoneRules.splice(from, 1); c.zoneRules.splice(to > from ? to - 1 : to, 0, x); });
      });
      rules.addEventListener('dragend', () => { drag = null; U.$$('.rule.before', rules).forEach(x => x.classList.remove('before')); });
      rules.addEventListener('keydown', ev => {
        const g = ev.target.closest('[data-grip]');
        if (!g || !ev.altKey || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
        ev.preventDefault();
        const i = +g.dataset.grip, j = i + (ev.key === 'ArrowUp' ? -1 : 1);
        if (j < 0 || j >= A.config.zoneRules.length) return;
        A.mutate(c => { const [x] = c.zoneRules.splice(i, 1); c.zoneRules.splice(j, 0, x); });
        const again = U.$(`[data-grip="${j}"]`); if (again) again.focus();
      });
    },
  };

  U.act.nameSel = el => { A.flush(); A.ui.name = el.dataset.k; A.save(); U.renderAll(); };
  U.act.sepToggle = el => {
    const k = el.dataset.k;
    A.mutate(c => {
      if (!el.checked) { c.templates[k] = ''; return; }
      const r = E.roles(E.index(c));
      c.templates[k] = k === 'sepDiscipline' ? (r.rowAttr ? `/----{${r.rowAttr.name}.desc|upper}----` : '/--------')
        : (r.rowAttr && r.groupAttr ? `/{${r.rowAttr.name}.kode}----{${r.groupAttr.name}.kode}----` : '/--------');
    });
  };
  U.act.ruleAdd = () => A.mutate(c => {
    const ids = (c.zoneRules || []).map(r => r.id);
    let n = ids.length + 1; while (ids.includes('zone-' + n)) n++;
    const row = E.roles(E.index(c)).rowAttr;
    (c.zoneRules = c.zoneRules || []).push({ id: 'zone-' + n, when: row ? [{ token: `${row.name}.kode`, op: 'eq', value: '' }] : [], patterns: ['{SITE}-'], source: '' });
  });
  U.act.ruleDel = async el => {
    const r = A.config.zoneRules[+el.dataset.i];
    if (!(await U.confirm(`Hapus aturan ${r.id}?`, 'Zone dari aturan ini tidak dibuat lagi. Ctrl+Z untuk kembali.', 'Hapus', true))) return;
    A.mutate(c => c.zoneRules.splice(+el.dataset.i, 1));
  };
  U.act.ruleForEach = el => A.mutate(c => { const r = c.zoneRules[+el.dataset.i]; if (el.value) r.forEach = el.value; else delete r.forEach; });
  U.act.patAdd = el => A.mutate(c => c.zoneRules[+el.dataset.i].patterns.push('{SITE}-'));
  U.act.patDel = el => A.mutate(c => c.zoneRules[+el.dataset.i].patterns.splice(+el.dataset.k, 1));
})(UI);

/* ---- src/ui/screens/finish.js ---- */
/* Step 4 · Cek & Unduh. Status, download, run order in E3D, summary with "Ubah", project match,
   package contents (folded) and package options (⚙). */
(function (U) {
  'use strict';
  const E = E3D, A = U.App, esc = U.esc;
  const FILE_TPL = [['teamsFolder', 'Folder 00-TEAMS'], ['teamsFile', 'File 00-TEAMS'], ['discFolder', 'Folder per baris'], ['b1File', 'File B1'], ['b2File', 'File B2'],
    ['b3File', 'File B3'], ['refFolder', 'Folder 90'], ['refFile', 'File 90'], ['fixupFolder', 'Folder 99'], ['fixupFile', 'File 99'], ['registerFile', 'Register']];
  const OPTS = [['includeReadme', 'README'], ['includeRegister', 'Register .xlsx'], ['includeConfig', 'config.json'], ['includeReference', '90 · DB referensi'],
    ['includeFixup', '99 · perbaiki urutan MDB'], ['includeExistingTeamsBlock', 'Team lama (sebagai komentar)']];
  const KW = /^(NEW SITE|NEW ZONE|CREATE TEAM|CREATE DB|SET MDB|SET TEAM|TADD|ADD|CURRENT|SAVEWORK)\b(.*)$/;
  const highlight = t => t.split(/\r?\n/).map(l => { if (l.startsWith('$*')) return `<span class="c">${esc(l)}</span>`; const m = l.match(KW); return m ? `<span class="k">${esc(m[1])}</span>${esc(m[2])}` : esc(l); }).join('\n');

  function textOf(path) {
    const f = A.r.files.find(x => x.path === path);
    if (f) return f.text;
    if (path === '00-README.txt') return E.readme(A.r.cfg, A.r.model, A.r.issues, A.r.files, new Date());
    if (path === 'config.json') return E.exportJson(A.config);
    return null;
  }
  const parts = {
    hero(A) {
      const errs = A.errors().length, warns = A.warnings().length, o = A.config.output || {};
      if (errs) return `<div class="hero bad"><span class="hero-ic">${U.icon('error')}</span><div class="grow"><h2>${errs} masalah perlu diperbaiki</h2><span>Unduh aktif lagi setelah semua beres.</span></div>
        <button type="button" class="btn filled" data-act="problems">Lihat masalah</button></div>`;
      if (!A.r.model.cells.length) return `<div class="hero"><span class="hero-ic">${U.icon('info')}</span><div class="grow"><h2>Belum ada DB</h2><span>Isi Daftar dan Susunan dulu.</span></div>
        <button type="button" class="btn filled" data-act="go" data-screen="1">Ke Daftar</button></div>`;
      const extra = [o.includeReadme && 'README', o.includeRegister && 'register', o.includeConfig && 'config.json'].filter(Boolean);
      return `<div class="hero ok"><span class="hero-ic">${U.icon('check')}</span><div class="grow"><h2>Siap diunduh</h2>
        <span>${A.r.files.length} macro${extra.length ? ' · ' + extra.join(' · ') : ''}${warns ? ` · <button type="button" class="link" data-act="problems">${warns} catatan</button>` : ''}</span></div>
        <button type="button" class="btn filled big" data-act="generateZip">${U.icon('download')}Unduh ${esc(A.config.project.packageName || 'ZIP')}</button></div>`;
    },
    summary(A) {
      const c = A.config, { rowAttr, colAttr } = E.roles(A.r.cfg);
      const rows = c.attributes.reduce((n, a) => n + a.rows.length, 0);
      const items = [
        [1, 'Daftar', `${c.attributes.length} daftar · ${U.num(rows)} baris · ${c.referenceDbs.length} DB referensi`],
        [2, 'Susunan', rowAttr && colAttr ? `${esc(rowAttr.name)} × ${esc(colAttr.name)} · ${U.num(A.r.counts.dbs)} DB` : 'belum diatur'],
        [3, 'Nama', `${(c.zoneRules || []).length} aturan zone · ${U.num(A.r.counts.zones)} zone`],
      ];
      return items.map(([n, t, s]) => {
        const e = U.stepErrors(n);
        return `<div class="sumcard"><b>${t}${e ? ` <span class="chip err">${e}</span>` : ''}</b><span>${s}</span><button type="button" class="btn sm text" data-act="go" data-screen="${n}">${U.icon('edit', 'sm')}Ubah</button></div>`;
      }).join('');
    },
    match(A) {
      const u = A.config.inUse;
      if (!u || (!(u.teams || []).length && !(u.dbs || []).length))
        return `<button type="button" class="dropzone" data-act="matchProject">Seret Export Config (.xlsx) project tujuan ke sini · cek nama team, DB dan DBNO yang sudah dipakai</button>`;
      const clash = A.errors().filter(i => ['V07', 'V08', 'V21'].includes(i.id)).length + A.warnings().filter(i => i.id === 'V21').length;
      return `<div class="inline"><span class="chip ${clash ? 'err' : 'ok'}">${U.icon(clash ? 'error' : 'check')}${clash ? `${clash} bentrok` : 'Tidak ada bentrok'}</span>
        <span class="hint">${esc(u.source || '')} · ${U.num((u.teams || []).length)} team · ${U.num((u.dbs || []).length)} DB</span><span class="spacer"></span>
        <button type="button" class="btn sm text" data-act="matchProject">Ganti</button><button type="button" class="btn sm text danger" data-act="matchClear">Hapus</button></div>`;
    },
    files(A) {
      if (!A.ui.showFiles) return '';
      const names = E.packageNames(A.r.cfg, A.r.files);
      if (!names.includes(A.ui.file)) A.ui.file = names.find(n => /B2/.test(n)) || names[0];
      const by = Object.fromEntries(A.r.files.map(f => [f.path, f]));
      const groups = new Map();
      for (const p of names) { const i = p.lastIndexOf('/'), f = i < 0 ? '' : p.slice(0, i); if (!groups.has(f)) groups.set(f, []); groups.get(f).push(p); }
      const tree = [...groups].map(([f, ps]) => (f ? `<div class="fold">${U.icon('folder', 'sm')}${esc(f)}</div>` : '') + ps.map(p => {
        const n = p.slice(p.lastIndexOf('/') + 1), fl = by[p];
        return `<button type="button" class="file${f ? '' : ' top'}" data-act="fileSel" data-path="${esc(p)}" aria-selected="${p === A.ui.file}"><span>${esc(n)}</span><small>${fl ? fl.module : ''}</small></button>`;
      }).join('')).join('');
      const p = A.ui.file, n = p.slice(p.lastIndexOf('/') + 1);
      let view;
      if (n.endsWith('.xlsx')) {
        const sheets = E.registerSheets(A.r.cfg, A.r.model, A.r.issues, A.r.files);
        view = `<div class="tbl"><table><thead><tr><th>Sheet</th><th class="num">Baris</th></tr></thead><tbody>${sheets.map(s => `<tr><td>${esc(s.name)}</td><td class="num">${U.num(s.rows.length - 1)}</td></tr>`).join('')}</tbody></table></div>`;
      } else {
        const lines = (textOf(p) || '').split(/\r?\n/), cap = 3000;
        view = `<pre class="code" id="codeView">${highlight(lines.slice(0, cap).join('\n'))}${lines.length > cap ? `\n<span class="c">… ${lines.length - cap} baris lagi</span>` : ''}</pre>`;
      }
      return `<div class="files-view"><div class="files" data-keep-scroll="files">${tree}</div>
        <div class="stack grow"><div class="inline"><b class="mono">${esc(p)}</b><span class="spacer"></span>
          ${n.endsWith('.xlsx') ? '' : `<button type="button" class="btn sm text" data-act="fileCopy">${U.icon('copy', 'sm')}Salin</button>`}
          <button type="button" class="btn sm text" data-act="fileDownload">${U.icon('download', 'sm')}Unduh file</button></div>${view}</div></div>`;
    },
  };

  U.screens[4] = {
    parts,
    select(A, loc) { if (loc.file) { A.ui.showFiles = true; A.ui.file = loc.file; } },
    render(A) {
      const steps = [['0', 'Team', 'Admin'], ['B1', 'DB + MDB', 'Admin'], ['B2', 'Site', 'Design'], ['B3', 'Zone', 'Design'], ['90', 'DB referensi', 'Admin'], ['99', 'Perbaiki MDB', 'opsional']];
      return `<div class="page">
        <div data-part="hero">${parts.hero(A)}</div>
        <section class="card"><h2>Jalankan di E3D</h2>
          <ol class="timeline">${steps.map(s => `<li><b class="mono">${s[0]}</b><span>${s[1]}</span><small class="${s[2] === 'Admin' ? 'adm' : s[2] === 'Design' ? 'des' : ''}">${s[2]}</small></li>`).join('')}</ol>
          <span class="hint">B1 → masuk ulang DESIGN → B2 → B3, diulang per baris. Lengkap di 00-README.txt.</span>
          <div class="note">Error acak <span class="mono">(43,41) Unable to open DB … MCD:6</span> saat CREATE DB: catat DB-nya, hapus di Admin bila rusak, buat ulang, lanjutkan (§7).</div></section>
        <div class="sums" data-part="summary">${parts.summary(A)}</div>
        <section class="card" data-loc="f:inUse"><div class="card-head"><h2>Cocokkan dengan project tujuan</h2><span class="hint">opsional</span></div><div data-part="match">${parts.match(A)}</div></section>
        <section class="card"><div class="card-head"><h2>Isi paket</h2><span class="spacer"></span>
          <button type="button" class="btn sm text" data-act="optsOpen">${U.icon('gear', 'sm')}Opsi paket</button>
          <button type="button" class="btn sm text" data-act="filesToggle" aria-expanded="${!!A.ui.showFiles}">${A.ui.showFiles ? 'Tutup' : 'Lihat file'}${U.icon('chev', 'sm')}</button></div>
          <div data-part="files">${parts.files(A)}</div></section>
      </div>`;
    },
  };

  U.act.filesToggle = () => { A.ui.showFiles = !A.ui.showFiles; U.renderScreen(); };
  U.act.fileSel = el => { A.ui.file = el.dataset.path; U.refresh(); };
  U.act.fileCopy = () => {
    const t = textOf(A.ui.file) || '';
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(U.$('#codeView')); getSelection().removeAllRanges(); getSelection().addRange(r); U.toast('Teks dipilih: tekan Ctrl+C'); };
    try { navigator.clipboard.writeText(t).then(() => U.toast('Disalin'), fallback); } catch (e) { fallback(); }
  };
  U.act.fileDownload = async () => {
    const p = A.ui.file, n = p.slice(p.lastIndexOf('/') + 1);
    if (n.endsWith('.xlsx')) return U.download(new Blob([await E.xlsx.write(E.registerSheets(A.r.cfg, A.r.model, A.r.issues, A.r.files))], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), n);
    U.download(textOf(p), n, 'text/plain');
  };

  /* ⚙ Opsi paket */
  const optParts = {
    probs: () => U.problems(FILE_TPL.map(([k]) => 't:' + k)),
  };
  U.act.optsOpen = () => U.openSheet('Opsi paket', () => {
    const o = A.config.output || {};
    return `<div class="field"><label for="o-pkg">Nama ZIP</label><input id="o-pkg" class="mono" data-bind="project.packageName" value="${esc(A.config.project.packageName)}" spellcheck="false"></div>
      <h3>Isi</h3><div class="opts">${OPTS.map(([k, l]) => `<label><input type="checkbox" data-bind="output.${k}" ${o[k] ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
      <h3>Pembagian file</h3><div class="opts">
        <label><input type="radio" name="split" data-change="splitSet" value="perDiscipline" ${o.split !== 'perStep' ? 'checked' : ''}><span>Per baris (folder tiap disiplin)</span></label>
        <label><input type="radio" name="split" data-change="splitSet" value="perStep" ${o.split === 'perStep' ? 'checked' : ''}><span>Satu file per langkah (B1, B2, B3)</span></label></div>
      <h3>Nama file &amp; folder</h3>
      <div class="ftpl">${FILE_TPL.map(([k, l]) => `<label for="ft-${k}">${l}</label><input id="ft-${k}" class="input mono" data-bind="templates.${k}" data-loc="t:${k}" value="${esc(A.config.templates[k] || '')}" spellcheck="false">`).join('')}</div>
      <div class="chips" data-spart="probs">${optParts.probs()}</div>`;
  }, optParts);
  U.act.splitSet = el => A.mutate(c => { c.output.split = el.value; });
})(UI);

/* ---- src/ui/main.js ---- */
/* Boot. Everything runs offline from one file; the CSP in index.html blocks any network request. */
(function (U) {
  'use strict';
  window.addEventListener('error', ev => U.toast && U.toast('Kesalahan tak terduga: ' + (ev.message || ev), 'error'));
  window.addEventListener('unhandledrejection', ev => U.toast && U.toast('Kesalahan tak terduga: ' + ((ev.reason && ev.reason.message) || ev.reason), 'error'));
  function boot() {
    U.buildShell();
    U.initTheme();
    U.App.load();
    U.App.recompute();
    U.renderAll();
    U.maybeTour();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(UI);

</script>
</body>
</html>
