/* ---------- Surfaces ---------- */

        if (head === 'PROJECT') {
          if (parts.length !== 2 || !Object.prototype.hasOwnProperty.call(cfg.d.project || {}, parts[1]))

          if (parts.length !== 1) throw new TplError(`token '${t.path}': ${head} tidak punya kolom`);

          if (parts.length === 1) throw new TplError(`token '${t.path}' perlu nama kolom`);

          for (let i = 1; i < parts.length; i++) {
            const c = cfg.col(attrId, parts[i]);
            if (!c) throw new TplError(`kolom '${parts[i]}' tidak ada di ${cfg.attrs[attrId].name}`);
            if (i < parts.length - 1) {
              if (c.type !== 'ref') throw new TplError(`'${parts[i]}' di '${t.path}' bukan kolom referensi`);

              if (!cfg.attrs[attrId]) throw new TplError(`target '${c.target}' tidak ada`);
            }

  E.evaluate = function (expr) {
    const toks = String(expr).match(/\d+|[-+*/()]/g) || [];
    if (toks.join('') !== String(expr).replace(/\s+/g, '') || !toks.length)
      throw new ExprError(`ekspresi tidak valid '${expr}'`);

    function factor() {
      const t = take();
      if (t === '(') {
        const v = sum();
        if (take() !== ')') throw new ExprError(`kurung tidak berpasangan '${expr}'`);
        return v;
      }
      if (t === '-') return -factor();
      if (t === undefined || !/^\d+$/.test(t)) throw new ExprError(`ekspresi tidak valid '${expr}'`);
      return parseInt(t, 10);
    }
    function term() {
      let v = factor();
      while (peek() === '*' || peek() === '/') {
        const op = take(), r = factor();
        if (op === '*') v *= r;
        else {
          if (r === 0) throw new ExprError(`pembagian dengan nol '${expr}'`);
          if (v % r) throw new ExprError(`hasil bukan bilangan bulat '${expr}'`);
          v = v / r;
        }
      }
      return v;
    }
    function sum() {
      let v = term();
      while (peek() === '+' || peek() === '-') v = take() === '+' ? v + term() : v - term();
      return v;
    }
    const v = sum();
    if (pos !== toks.length) throw new ExprError(`ekspresi tidak valid '${expr}'`);

      if (w.op === 'ne' && v === String(w.value)) return false;
      if (w.op === 'in' && !list.includes(v)) return false;

/* ---- src/engine/model.js ---- */
/* Model: cells (row attr x column attr), separators, zones. SPEC §4 steps 1-7. */
(function (E) {
  'use strict';

  // Which template is rendered in which context (SPEC 3.2).
  E.TEMPLATE_KINDS = {
    dbName: 'cell', dbDesc: 'cell', dbNo: 'cell', mdbPos: 'cell', site: 'cell',
    sepDiscipline: 'row', sepGroup: 'group',
    discFolder: 'row', b1File: 'row', b2File: 'row', b3File: 'row',
    teamsFolder: 'project', teamsFile: 'project', refFolder: 'project', refFile: 'project',
    fixupFolder: 'project', fixupFile: 'project', registerFile: 'project',
  };
  E.EXPRESSION_TEMPLATES = ['dbNo', 'mdbPos'];
  E.OPTIONAL_TEMPLATES = ['sepDiscipline', 'sepGroup'];

  // Attribute names that play the row / column / group parts of the combination.
  E.roles = function (cfg) {
    const comb = cfg.d.combination || {};
    const rowAttr = cfg.attrs[comb.rowAttr] || null, colAttr = cfg.attrs[comb.colAttr] || null;
    const gcol = colAttr && comb.groupBy ? cfg.col(colAttr.id, comb.groupBy) : null;
    const groupAttr = gcol && gcol.type === 'ref' ? cfg.attrs[gcol.target] || null : null;
    return { rowAttr, colAttr, groupAttr, groupCol: groupAttr ? comb.groupBy : null };
  };

  E.contextHeads = function (cfg, kind, forEachId) {
    const { rowAttr, colAttr, groupAttr } = E.roles(cfg);
    const r = rowAttr ? [rowAttr.name] : [], c = colAttr ? [colAttr.name] : [], g = groupAttr ? [groupAttr.name] : [];
    switch (kind) {
      case 'cell': return [...r, ...c, ...g, 'INDEX', 'PROJECT'];
      case 'row': return [...r, 'PROJECT'];
      case 'group': return [...r, ...g, ...c, 'PROJECT'];
      case 'condition': return [...r, ...c, ...g];
      case 'zone': {
        const fe = forEachId && cfg.attrs[forEachId] ? [cfg.attrs[forEachId].name] : [];
        return [...r, ...c, ...g, 'INDEX', 'PROJECT', 'SITE', ...fe];
      }
      default: return ['PROJECT'];
    }
  };

  const num = v => (typeof v === 'number' ? v : parseFloat(v));

  E.buildModel = function (cfg) {
    const d = cfg.d, t = d.templates || {}, comb = d.combination || {};
    const { rowAttr, colAttr, groupAttr, groupCol } = E.roles(cfg);
    const model = { disciplines: [], cells: [], exprErrors: [], rowAttr, colAttr, groupAttr };
    if (!rowAttr || !colAttr) return model;
    const excluded = new Set((comb.excluded || []).map(p => p[0] + '\u0000' + p[1]));
    const mode = comb.mode || 'matrix';
    const hasUrutan = !!cfg.col(rowAttr.id, 'urutan');
    const discs = (rowAttr.rows || []).map((r, i) => [r, i])
      .sort((a, b) => hasUrutan ? (num(a[0].urutan) - num(b[0].urutan)) || (a[1] - b[1]) : a[1] - b[1])
      .map(x => x[0]);
    const mdbCol = cfg.col(rowAttr.id, 'mdb');
    const sepRole = groupAttr && groupAttr.role === 'separator' && t.sepGroup;

    for (const dr of discs) {
      const cells = [];
      let idx = 0;
      const rowMdb = mdbCol && mdbCol.type === 'text' && dr.mdb ? dr.mdb : comb.mdb;
      for (const ar of colAttr.rows || []) {
        const base = { [rowAttr.name]: dr, [colAttr.name]: ar };
        if (groupAttr) base[groupAttr.name] = cfg.rows[groupAttr.id].get(ar[groupCol]);
        if (mode === 'matrix' && excluded.has(dr.kode + '\u0000' + ar.kode)) continue;
        if (mode === 'condition' && !E.matches(cfg, comb.condition || [], base)) continue;
        idx += 1;
        const ctx = Object.assign({}, base, { INDEX: idx });
        const cell = { ctx, rowKode: dr.kode, colKode: ar.kode, group: groupCol ? ar[groupCol] : null, mdb: rowMdb };
        cell.db = E.render(cfg, t.dbName, ctx);
        cell.desc = E.render(cfg, t.dbDesc, ctx);
        for (const [key, tpl] of [['dbno', 'dbNo'], ['pos', 'mdbPos']]) {
          try { cell[key] = E.evaluate(E.render(cfg, t[tpl], ctx)); } catch (e) {
            if (!(e instanceof E.ExprError)) throw e;
            cell[key] = null;
            model.exprErrors.push({ template: tpl, cell, message: e.message });
          }
        }
        cell.site = E.render(cfg, t.site, ctx);
        cell.team = cell.db.includes('/') ? cell.db.split('/')[0] : null;
        ctx.SITE = cell.site;
        const zones = [], zoneRules = [];
        let targeted = false;
        for (const rule of d.zoneRules || []) {
          if (!E.matches(cfg, rule.when, ctx)) continue;
          if ((rule.when || []).some(w => String(w.token).split('.')[0] === rowAttr.name)) targeted = true;
          const fa = rule.forEach ? cfg.attrs[rule.forEach] : null;
          if (fa) {
            for (const fr of fa.rows || []) {
              const zctx = Object.assign({}, ctx, { [fa.name]: fr });
              for (const p of rule.patterns || []) { zones.push(E.render(cfg, p, zctx)); zoneRules.push(rule.id); }
            }
          } else if (!rule.forEach) {
            for (const p of rule.patterns || []) { zones.push(E.render(cfg, p, ctx)); zoneRules.push(rule.id); }
          }
        }
        cell.zones = zones;
        cell.zoneRules = zoneRules;
        cell.targeted = targeted;
        cells.push(cell);
      }
      if (!cells.length) continue;
      const dctx = { [rowAttr.name]: dr };
      const groupSeps = new Map();
      if (sepRole) {
        for (const c of cells) if (!groupSeps.has(c.group)) groupSeps.set(c.group, E.render(cfg, t.sepGroup, c.ctx));
      }
      model.disciplines.push({
        row: dr, ctx: dctx, cells, mdb: rowMdb,
        sepDiscipline: t.sepDiscipline ? E.render(cfg, t.sepDiscipline, dctx) : null,
        groupSeps,
      });

  // Site creation order of one row (drives B2): {kind, name, db, cell?, group?}. SPEC §4 steps 5-6.
  E.siteOrder = function (dd) {
    const out = [];
    if (dd.sepDiscipline) out.push({ kind: 'sepDiscipline', name: dd.sepDiscipline, db: dd.cells[0].db });
    let lastGroup = {};
    for (const c of dd.cells) {
      if (c.group !== lastGroup) {
        lastGroup = c.group;
        if (dd.groupSeps.has(c.group)) out.push({ kind: 'sepGroup', name: dd.groupSeps.get(c.group), db: c.db, group: c.group });
      }
      out.push({ kind: 'site', name: c.site, db: c.db, cell: c, group: c.group });
    }
    return out;
  };

  E.counts = function (cfg, model) {
    const teamAttr = cfg.role('team')[0];
    const teams = teamAttr ? teamAttr.rows || [] : [];
    const refs = cfg.d.referenceDbs || [];
    return {
      teamsNew: teams.filter(r => !r.existing).length,
      teamsExisting: teams.filter(r => r.existing).length,
      dbs: model.cells.length,
      sites: model.cells.length,
      separators: model.disciplines.reduce((n, dd) => n + (dd.sepDiscipline ? 1 : 0) + dd.groupSeps.size, 0),
      zones: model.cells.reduce((n, c) => n + c.zones.length, 0),
      refsActive: refs.filter(r => r.active).length,
      refsInactive: refs.filter(r => !r.active).length,
    };
  };
})(E3D);

      'COUNTS',
      ` Teams new/existing: ${c.teamsNew}/${c.teamsExisting}  DBs: ${c.dbs}  Sites: ${c.sites}  Separators: ${c.separators}  Zones: ${c.zones}  Reference DBs: ${c.refsActive}`,
    ];
    return join(L.map(s => s.replace(/[^\x00-\x7F]/g, '?')), E.eol(cfg));
  };
})(E3D);

/* ---- src/engine/validate.js ---- */
/* Validation V01-V24 (docs/RULES.md §3). Each issue: {id, severity, ref, message, location}.
   location.screen: 1 Project, 2 Attribute, 3 Relasi & kombinasi, 4 Template, 5 Preview, 6 Generate. */
(function (E) {
  'use strict';

  const ID_RE = /^[a-z][a-z0-9_]*$/, NAME_RE = /^[A-Za-z][A-Za-z0-9_]*$/, COL_RE = /^[a-zA-Z][a-zA-Z0-9_]*$/;
  const empty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);

  E.validate = function (cfg, model, files) {
    const issues = [], d = cfg.d;
    const add = (id, severity, ref, message, location) => issues.push({ id, severity, ref, message, location: location || {} });
    const cellLoc = (c, extra) => Object.assign({ screen: 3, cell: [c.rowKode, c.colKode] }, extra);

    /* V02: attribute structure */
    const names = new Map(), ids = new Map();
    const roleCount = { team: 0, user: 0 };
    for (const a of d.attributes || []) {
      const loc = { screen: 2, attributeId: a.id };
      if (!ID_RE.test(a.id || '')) add('V02', 'error', '-', `Id attribute (${a.id}) harus [a-z][a-z0-9_]*`, loc);
      if (ids.has(a.id)) add('V02', 'error', '-', `Id attribute (${a.id}) duplikat`, loc);
      ids.set(a.id, a);
      if (!NAME_RE.test(a.name || '')) add('V02', 'error', '-', `Nama attribute (${a.name}) harus [A-Za-z][A-Za-z0-9_]* (tanpa spasi)`, loc);
      if (E.RESERVED_HEADS.includes(a.name)) add('V02', 'error', '-', `Nama attribute (${a.name}) dipakai oleh token sistem`, loc);
      if (names.has(a.name)) add('V02', 'error', '-', `Nama attribute (${a.name}) duplikat`, loc);
      names.set(a.name, a);
      if (a.role in roleCount && ++roleCount[a.role] === 2) add('V02', 'error', '-', `Lebih dari satu attribute berperan ${a.role}`, loc);
      const colIds = new Set();
      for (const c of a.columns || []) {
        const cl = Object.assign({ column: c.id }, loc);
        if (!COL_RE.test(c.id || '')) add('V02', 'error', '-', `Id kolom (${a.name}.${c.id}) tidak valid`, cl);
        if (colIds.has(c.id)) add('V02', 'error', '-', `Id kolom (${a.name}.${c.id}) duplikat`, cl);
        colIds.add(c.id);
        if ((c.type === 'ref' || c.type === 'refList') && !cfg.attrs[c.target])
          add('V02', 'error', '-', `Kolom ${a.name}.${c.id} menunjuk attribute (${c.target}) yang tidak ada`, cl);
      }
      for (const k of ['kode', 'desc']) if (!colIds.has(k)) add('V02', 'error', '-', `Attribute ${a.name} wajib punya kolom ${k}`, loc);
    }
    const { rowAttr, colAttr } = E.roles(cfg);
    const comb = d.combination || {};
    if (!rowAttr) add('V02', 'error', '-', `Attribute baris (${comb.rowAttr || '-'}) belum dipilih atau tidak ada`, { screen: 3 });
    if (!colAttr) add('V02', 'error', '-', `Attribute kolom (${comb.colAttr || '-'}) belum dipilih atau tidak ada`, { screen: 3 });
    if (colAttr && comb.groupBy) {
      const gc = cfg.col(colAttr.id, comb.groupBy);
      if (!gc || gc.type !== 'ref') add('V02', 'error', '-', `Grup kolom (${comb.groupBy}) harus kolom referensi di ${colAttr.name}`, { screen: 3 });
    }
    if (rowAttr && !cfg.col(rowAttr.id, 'urutan')) add('V02', 'error', '-', `Attribute baris ${rowAttr.name} perlu kolom angka 'urutan'`, { screen: 2, attributeId: rowAttr.id });

    /* V01: attribute data */
    for (const a of d.attributes || []) {
      const seen = new Set();
      (a.rows || []).forEach((r, i) => {
        const key = r.kode, rl = col => ({ screen: 2, attributeId: a.id, rowKode: key, rowIndex: i, column: col });
        if (!empty(r.kode) && seen.has(r.kode)) add('V01', 'error', '-', `Kode ${r.kode} (${a.name}) duplikat`, rl('kode'));
        seen.add(r.kode);
        for (const c of a.columns || []) {
          const v = r[c.id], what = `${c.name || c.id} (${a.name}, ${key || '#' + (i + 1)})`;
          if (empty(v)) {
            if (c.required || c.id === 'kode' || c.id === 'desc') add('V01', 'error', '-', `${what} wajib diisi`, rl(c.id));
            continue;
          }
          if (c.type === 'number' && !Number.isInteger(v)) add('V01', 'error', '-', `${what} harus bilangan bulat (${v})`, rl(c.id));
          if (c.type === 'boolean' && typeof v !== 'boolean') add('V01', 'error', '-', `${what} harus ya/tidak`, rl(c.id));
          if (c.type === 'text' && typeof v !== 'string') add('V01', 'error', '-', `${what} harus teks`, rl(c.id));
          if ((c.type === 'ref' || c.type === 'refList') && cfg.rows[c.target]) {
            const tname = cfg.attrs[c.target].name;
            for (const x of c.type === 'ref' ? [v] : (Array.isArray(v) ? v : [v]))
              if (!cfg.rows[c.target].has(x)) add('V01', 'error', '-', `${what}: ${x} tidak ada di ${tname}`, rl(c.id));
          }
        }
        if (a.role === 'team' && String(r.desc || '').includes("'"))
          add('V01', 'error', '-', `Deskripsi team ${key} mengandung tanda kutip '`, rl('desc'));
      });
    }

    /* V03: template tokens resolve in their context */
    const t = d.templates || {};
    for (const [key, kind] of Object.entries(E.TEMPLATE_KINDS)) {
      if (empty(t[key])) {
        if (!E.OPTIONAL_TEMPLATES.includes(key)) add('V03', 'error', '-', `Template ${key} kosong`, { screen: 4, template: key });
        continue;
      }
      for (const m of E.checkTemplate(cfg, t[key], E.contextHeads(cfg, kind)))
        add('V03', 'error', '-', `Template ${key}: ${m}`, { screen: 4, template: key });
    }
    for (const [i, rule] of (d.zoneRules || []).entries()) {
      const loc = { screen: 4, zoneRule: i };
      if (rule.forEach && !cfg.attrs[rule.forEach]) add('V03', 'error', '-', `Aturan zone ${rule.id}: attribute forEach (${rule.forEach}) tidak ada`, loc);
      const heads = E.contextHeads(cfg, 'zone', rule.forEach);
      for (const p of rule.patterns || []) for (const m of E.checkTemplate(cfg, p, heads)) add('V03', 'error', '-', `Aturan zone ${rule.id}: ${m}`, loc);
      for (const w of rule.when || []) for (const m of E.checkTemplate(cfg, `{${w.token}}`, E.contextHeads(cfg, 'cell').concat('SITE')))
        add('V03', 'error', '-', `Aturan zone ${rule.id}, syarat: ${m}`, loc);
    }
    if (comb.mode === 'condition')
      for (const w of comb.condition || []) for (const m of E.checkTemplate(cfg, `{${w.token}}`, E.contextHeads(cfg, 'condition')))
        add('V03', 'error', '-', `Kondisi kombinasi: ${m}`, { screen: 3 });

    /* V04: expressions */
    const exprSeen = new Set();
    for (const x of model.exprErrors) {
      const k = x.template + x.message;
      if (exprSeen.has(k)) continue;
      exprSeen.add(k);
      add('V04', 'error', '-', `${x.template} (${x.cell.rowKode} x ${x.cell.colKode}): ${x.message}`, { screen: 4, template: x.template, cell: [x.cell.rowKode, x.cell.colKode] });
    }

    /* V11 */
    const def = d.dbDefaults || {};
    if (def.access === 'MULTIWRITE' && !E.MULTIWRITE_TYPES.includes(def.type))
      add('V11', 'error', '1.4', `Type ${def.type} tidak bisa MULTIWRITE (hanya DESI, CATA, DRAFT, ISODRAFT)`, { screen: 1, field: 'dbDefaults' });

    /* V05-V08: DBs */
    const teamAttr = cfg.role('team')[0];
    const teams = teamAttr ? cfg.rows[teamAttr.id] : new Map();
    const inUse = d.inUse || null;
    const usedNo = new Map(), usedName = new Set();
    for (const x of (inUse && inUse.dbs) || []) {
      if (x.number !== null && x.number !== undefined) usedNo.set(x.number, `${x.name} (project)`);
      usedName.add(x.name);
    }
    const seenNo = new Map(), seenDb = new Set();
    for (const c of model.cells) {
      const loc = cellLoc(c);
      if (c.team === null) add('V05', 'error', '1.1, 1.12', `Nama DB (${c.db}) harus TEAM/NAMA`, { screen: 4, template: 'dbName' });
      else if (!teams.has(c.team)) add('V05', 'error', '1.1, 1.12', `Team pemilik ${c.team} (${c.db}) tidak ada di tabel Team`, { screen: 4, template: 'dbName', cell: loc.cell });
      const n = c.dbno;
      if (n !== null) {
        if (!((n >= 1 && n <= 7000) || (n >= 10000 && n <= 250000)))
          add('V06', 'error', '1.3', `DBNO ${n} (${c.db}) di luar 1-7000 / 10000-250000`, Object.assign(loc, { screen: 4, template: 'dbNo' }));
        const prev = seenNo.get(n) || usedNo.get(n);
        if (prev) add('V07', 'error', '1.3', `DBNO ${n} (${c.db}) sudah dipakai oleh ${prev}`, cellLoc(c, { screen: 4, template: 'dbNo' }));
        seenNo.set(n, c.db);
      }
      if (seenDb.has(c.db)) add('V08', 'error', '1.1', `Nama DB ${c.db} duplikat`, cellLoc(c, { screen: 4, template: 'dbName' }));
      else if (usedName.has(c.db)) add('V08', 'error', '1.1', `Nama DB ${c.db} sudah ada di project (Export Config)`, cellLoc(c, { screen: 4, template: 'dbName' }));
      seenDb.add(c.db);
      if (String(c.desc).includes("'")) add('V01', 'error', '-', `DESC (${c.db}) mengandung tanda kutip '`, { screen: 4, template: 'dbDesc' });
    }

    const mdbNames = new Set((d.mdbs || []).map(m => m.name));
    const refs = d.referenceDbs || [];
    const perMdb = new Map();
    const push = (m, pos, db, loc) => { if (!perMdb.has(m)) perMdb.set(m, []); perMdb.get(m).push({ pos, db, loc }); };
    for (const c of model.cells) push(c.mdb, c.pos, c.db, cellLoc(c, { screen: 4, template: 'mdbPos' }));
    const refSeen = new Set();
    refs.forEach((r, i) => {
      const loc = { screen: 1, refIndex: i };
      if (refSeen.has(r.db)) add('V23', 'error', '§2', `DB referensi ${r.db} duplikat`, loc);
      refSeen.add(r.db);
      if (!r.active) return;
      if (r.pos === null || r.pos === undefined || r.pos === '') add('V23', 'error', '§2', `DB referensi ${r.db} aktif tapi tanpa posisi`, loc);
      else push(comb.mdb, r.pos, r.db, loc);

    for (const [m, list] of perMdb) {
      if (!mdbNames.has(m)) add('V09', 'error', '§2', `MDB ${m} tidak ada di daftar MDB`, { screen: 1, field: 'mdbs' });

      for (const x of list) {
        if (x.pos === null) continue;
        if (!(Number.isInteger(x.pos) && x.pos >= 1 && x.pos <= 5000)) add('V09', 'error', '§2', `Posisi MDB ${x.pos} (${x.db}) di luar 1-5000`, x.loc);
        if (seen.has(x.pos)) add('V09', 'error', '§2', `Posisi MDB ${x.pos} (${x.db}) sudah dipakai oleh ${seen.get(x.pos)} di ${m}`, x.loc);
        seen.set(x.pos, x.db);
      }
      if (list.length > 1000) add('V10', 'error', '1.7', `${list.length} DB current di ${m} (maks 1000)`, { screen: 3 });
    }

    /* V12-V16, V24: names and site order */
    const elNames = new Set();
    for (const dd of model.disciplines) {
      const groups = [];
      let last = {};
      for (const c of dd.cells) {
        if (c.group !== last) {
          if (groups.includes(c.group)) add('V16', 'error', '3.4', `Grup ${c.group} tidak berurutan di baris ${dd.row.kode}`, { screen: 3, order: dd.row.kode });
          groups.push(c.group);
          last = c.group;
        }
      }
      const order = E.siteOrder(dd);
      if (order.length && order[0].kind !== 'site' && order[0].db !== dd.cells[0].db)
        add('V24', 'error', '3.2, 3.3', `Separator ${order[0].name} dibuat sebelum site DB-nya`, { screen: 3, order: dd.row.kode });
      const elems = order.map(s => ({ name: s.name, loc: s.kind === 'site' ? { screen: 4, template: 'site' } : { screen: 4, template: s.kind } }));
      for (const c of dd.cells) c.zones.forEach((z, i) => elems.push({ name: z, loc: { screen: 4, zoneRuleId: c.zoneRules[i] } }));
      for (const e of elems) {
        const n = e.name;
        if (!n.startsWith('/')) add('V12', 'error', '3.5', `Nama ${n} tidak diawali /`, e.loc);
        else if (n !== n.toUpperCase()) add('V14', 'warning', '3.5', `Nama ${n} bukan huruf besar (E3D case-sensitive)`, e.loc);
        else if (!E.NAME_OK_RE.test(n)) add('V15', 'warning', '§9', `Nama ${n} memakai karakter selain A-Z, 0-9, - (belum dites)`, e.loc);
        if (elNames.has(n)) add('V13', 'error', '-', `Nama elemen ${n} duplikat`, e.loc);
        elNames.add(n);
      }
    }

    /* V18: non-ASCII in generated lines */
    const nonAscii = new Set();
    for (const f of files || []) {
      if (!E.isAscii(f.path)) add('V18', 'error', 'tool', `Nama file ${f.path} berisi karakter non-ASCII`, { screen: 6, file: f.path });
      f.text.split(/\r?\n/).forEach((line, i) => {
        if (E.isAscii(line)) return;
        const bad = line.match(/[^\x00-\x7F]+/)[0];
        if (nonAscii.has(bad)) return;
        nonAscii.add(bad);
        add('V18', 'error', 'tool', `Baris ${i + 1} di ${f.name} berisi karakter non-ASCII (${bad})`, E.locateText(cfg, bad) || { screen: 6, file: f.path });
      });
    }

    /* V19, V20 */
    if (model.cells.some(c => c.zones.length) && !E.FACTS.newZoneTested)
      add('V19', 'warning', '§9', 'NEW ZONE setelah navigasi ke site belum dites (B3 tetap dibuat dengan peringatan)', { screen: 4, field: 'zoneRules' });
    for (const dd of model.disciplines)
      if (!dd.cells.some(c => c.targeted))
        add('V20', 'warning', '-', `Tidak ada aturan zone yang menargetkan baris ${dd.row.kode} (${dd.row.desc})`, { screen: 4, field: 'zoneRules' });

    /* V21, V22: in-use list */
    if (!inUse || (!(inUse.teams || []).length && !(inUse.dbs || []).length)) {
      add('V22', 'info', '-', 'Daftar terpakai (Export Config) belum dimuat: bentrok dengan data project tidak dicek', { screen: 1, field: 'inUse' });
    } else if (teamAttr) {
      const used = new Set(inUse.teams || []);
      for (const r of teamAttr.rows || [])
        if (!r.existing && used.has(r.kode))
          add('V21', 'warning', '-', `Team ${r.kode} sudah ada di project tapi ditandai baru (CREATE TEAM akan gagal: "Team name already defined")`,
            { screen: 2, attributeId: teamAttr.id, rowKode: r.kode, column: 'existing' });
    }
    return issues;
  };

  // Find an attribute cell whose text contains s (for V18 navigation).
  E.locateText = function (cfg, s) {
    for (const a of cfg.d.attributes || [])
      for (const [i, r] of (a.rows || []).entries())
        for (const c of a.columns || [])
          if (typeof r[c.id] === 'string' && r[c.id].includes(s)) return { screen: 2, attributeId: a.id, rowKode: r.kode, rowIndex: i, column: c.id };
    for (const [k, v] of Object.entries(cfg.d.project || {})) if (typeof v === 'string' && v.includes(s)) return { screen: 1, field: k };
    return null;
  };

  // Full pipeline used by UI and tests.
  E.compute = function (config) {
    const cfg = E.index(config);
    const model = E.buildModel(cfg);
    const files = E.generate(cfg, model);
    const issues = E.validate(cfg, model, files);
    return { cfg, model, files, issues, counts: E.counts(cfg, model) };
  };
})(E3D);

/* ---- src/engine/schema.js ---- */
/* config.json: empty config, structural check, migration, canonical export (SPEC §3, §8.1). */
(function (E) {
  'use strict';

  // Key order of schema/config.schema.json. Unknown keys are kept and appended in their own order.
  const ORDER = {
    root: ['schema', 'project', 'mdbs', 'dbDefaults', 'attributes', 'combination', 'templates', 'zoneRules', 'referenceDbs', 'inUse', 'output'],
    project: ['code', 'name', 'target', 'filePrefix', 'packageName', 'lineEnding'],
    mdb: ['name', 'default'],
    dbDefaults: ['type', 'access', 'claim'],
    attribute: ['id', 'name', 'role', 'columns', 'rows'],
    column: ['id', 'name', 'type', 'required', 'target'],
    combination: ['rowAttr', 'colAttr', 'groupBy', 'mode', 'excluded', 'condition', 'mdb'],
    templates: ['dbName', 'dbDesc', 'dbNo', 'mdbPos', 'site', 'sepDiscipline', 'sepGroup', 'teamsFolder', 'teamsFile',
      'discFolder', 'b1File', 'b2File', 'b3File', 'refFolder', 'refFile', 'fixupFolder', 'fixupFile', 'registerFile'],
    clause: ['token', 'op', 'value'],
    zoneRule: ['id', 'when', 'forEach', 'patterns', 'source'],
    ref: ['db', 'pos', 'active', 'note'],
    inUse: ['teams', 'dbs', 'source', 'importedAt'],
    inUseDb: ['name', 'number'],
    output: ['includeReadme', 'includeRegister', 'includeConfig', 'includeReference', 'includeFixup', 'includeExistingTeamsBlock', 'split'],
  };

  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  function ordered(obj, keys, map) {
    if (!isObj(obj)) return obj;
    const out = {};
    for (const k of keys) if (k in obj) out[k] = map && map[k] ? map[k](obj[k]) : obj[k];
    for (const k of Object.keys(obj)) if (!(k in out)) out[k] = obj[k];
    return out;
  }
  const each = (fn) => v => (Array.isArray(v) ? v.map(fn) : v);

  E.normalize = function (c) {
    const clauses = each(w => ordered(w, ORDER.clause));
    return ordered(c, ORDER.root, {
      project: v => ordered(v, ORDER.project),
      mdbs: each(m => ordered(m, ORDER.mdb)),
      dbDefaults: v => ordered(v, ORDER.dbDefaults),
      attributes: each(a => {
        const cols = (a && a.columns || []).map(x => x.id);
        return ordered(a, ORDER.attribute, {
          columns: each(x => ordered(x, ORDER.column)),
          rows: each(r => ordered(r, cols)),
        });
      }),
      combination: v => ordered(v, ORDER.combination, { condition: clauses }),
      templates: v => ordered(v, ORDER.templates),
      zoneRules: each(r => ordered(r, ORDER.zoneRule, { when: clauses })),
      referenceDbs: each(r => ordered(r, ORDER.ref)),
      inUse: v => ordered(v, ORDER.inUse, { dbs: each(x => ordered(x, ORDER.inUseDb)) }),
      output: v => ordered(v, ORDER.output),
    });
  };

  E.exportJson = c => JSON.stringify(E.normalize(c), null, 2) + '\n';

  // Structural check before import. Returns a list of messages (empty = OK).
  E.checkSchema = function (c) {
    const errs = [];
    const need = (cond, msg) => { if (!cond) errs.push(msg); };
    if (!isObj(c)) return ['Isi file bukan objek JSON'];
    if (typeof c.schema !== 'number') return ['Kunci "schema" (versi) tidak ada; bukan config E3D Setup Generator'];
    if (c.schema > E.SCHEMA_VERSION) return [`Config dibuat oleh versi lebih baru (skema ${c.schema}); tool ini skema ${E.SCHEMA_VERSION}`];
    for (const k of ['project', 'dbDefaults', 'combination', 'templates', 'output']) need(isObj(c[k]), `Kunci "${k}" harus objek`);
    for (const k of ['mdbs', 'attributes', 'zoneRules', 'referenceDbs']) need(Array.isArray(c[k]), `Kunci "${k}" harus daftar`);
    if (errs.length) return errs;
    for (const k of ORDER.project) need(k in c.project, `project.${k} tidak ada`);
    need(['CRLF', 'LF'].includes(c.project.lineEnding), 'project.lineEnding harus CRLF atau LF');
    need(c.mdbs.length >= 1 && c.mdbs.every(m => isObj(m) && typeof m.name === 'string'), 'mdbs: minimal satu MDB dengan nama');
    c.attributes.forEach((a, i) => {
      need(isObj(a) && typeof a.id === 'string' && typeof a.name === 'string', `attributes[${i}]: id dan name wajib`);
      need(isObj(a) && ['team', 'user', 'separator', 'none'].includes(a.role), `attributes[${i}]: role tidak valid`);
      need(isObj(a) && Array.isArray(a.columns) && Array.isArray(a.rows), `attributes[${i}]: columns dan rows harus daftar`);
      if (isObj(a) && Array.isArray(a.columns)) a.columns.forEach((col, j) => {
        need(isObj(col) && ['text', 'number', 'boolean', 'ref', 'refList'].includes(col.type), `attributes[${i}].columns[${j}]: type tidak valid`);
        if (isObj(col) && (col.type === 'ref' || col.type === 'refList')) need(typeof col.target === 'string', `attributes[${i}].columns[${j}]: target wajib`);
      });
      if (isObj(a) && Array.isArray(a.rows)) need(a.rows.every(isObj), `attributes[${i}].rows: setiap baris harus objek`);
    });
    need(['all', 'matrix', 'condition'].includes(c.combination.mode), 'combination.mode harus all, matrix, atau condition');
    for (const k of ['dbName', 'dbDesc', 'dbNo', 'mdbPos', 'site']) need(typeof c.templates[k] === 'string', `templates.${k} wajib`);
    c.zoneRules.forEach((r, i) => need(isObj(r) && Array.isArray(r.when) && Array.isArray(r.patterns), `zoneRules[${i}]: when dan patterns wajib`));
    c.referenceDbs.forEach((r, i) => need(isObj(r) && typeof r.db === 'string' && typeof r.active === 'boolean', `referenceDbs[${i}]: db dan active wajib`));
    if ('inUse' in c) need(isObj(c.inUse), 'inUse harus objek');
    return errs;
  };

  // Migrations: MIGRATIONS[n] turns schema n into n+1 and returns notes for the user.
  const MIGRATIONS = {};
  E.migrate = function (c) {
    const notes = [];
    let cfg = E.clone(c);
    while (cfg.schema < E.SCHEMA_VERSION) {
      const step = MIGRATIONS[cfg.schema];
      if (!step) throw new Error(`Tidak ada migrasi dari skema ${cfg.schema}`);
      notes.push(...step(cfg));
      cfg.schema += 1;
    }
    return { config: cfg, notes };
  };

  // "Kosong": structure only, no project data. Generic names, nothing project-specific.
  E.emptyConfig = function () {

    return `<span>Contoh</span>${ex.map(z => `<span class="v">${esc(z)}</span>`).join('') || '<span class="v">—</span>'}<span>${U.num(n)} zone di ${U.num(cells)} site</span>` + U.chipsFor('z:' + i);
  }

  function palette(A) {

    });
    groups.push(`<div class="grp" data-grp><b>PROJECT</b><div class="toks">${['PROJECT.code', 'PROJECT.name', 'PROJECT.filePrefix', 'PROJECT.target'].map(t => `<button type="button" class="tok sys" draggable="true" data-act="tokIns" data-tok="${t}">${t}</button>`).join('')}</div></div>`);
    groups.push(`<div class="grp" data-grp><b>Khusus</b><div class="toks"><button type="button" class="tok sys" draggable="true" data-act="tokIns" data-tok="INDEX" title="Nomor sel di dalam barisnya (1, 2, …)">INDEX</button><button type="button" class="tok sys" draggable="true" data-act="tokIns" data-tok="SITE" title="Nama site sel (hanya pola zone)">SITE</button></div></div>`);
    return `<div class="field"><label for="tokSearch">Cari token</label><input id="tokSearch" class="input" data-input="tokSearch" placeholder="mis. kode" autocomplete="off"></div>
      <span class="hint">Klik untuk menyisipkan di posisi kursor pola terakhir, atau seret ke pola. Filter (|upper, |lower, |pad:N) lewat klik chip token di pola.</span>
      <div class="palette">${groups.join('')}</div><span class="hint">${heads.length ? '' : 'Belum ada attribute.'}</span>`;

  function tcard(A, k) {
    const kind = E.TEMPLATE_KINDS[k];
    const disabled = k === 'sepGroup' && !(E.roles(A.r.cfg).groupAttr && E.roles(A.r.cfg).groupAttr.role === 'separator');
    return `<div class="tcard" data-loc="t:${k}" id="tpl-${k}">
      <div class="hd"><b>${k}</b><span class="hint">${esc(LABEL[k] || kind)}</span></div>
      ${U.patternEditor('templates.' + k, A.config.templates[k], null)}
      <div class="sample" data-part="s-${k}">${parts['s-' + k](A)}</div>
      <div class="chips" data-part="c-${k}">${parts['c-' + k](A)}</div>
      ${disabled ? '<span class="hint">Grup kolom belum diatur atau attribute grup tidak berperan Separator: tidak dipakai.</span>' : ''}
    </div>`;
  }

  function rules(A) {
    const zr = A.config.zoneRules || [];
    const cellTokens = U.tokenPaths(E.contextHeads(A.r.cfg, 'cell'));
    return zr.map((r, i) => {
      const zoneTokens = U.tokenPaths(E.contextHeads(A.r.cfg, 'zone', r.forEach));
      return `<div class="rule" data-loc="z:${i}" id="rule-${i}">
        <div class="hd"><span class="chip">${i + 1}</span>
          <input class="input mono" style="max-width:200px;height:32px" data-bind="zoneRules.${i}.id" value="${esc(r.id)}" aria-label="Id aturan" spellcheck="false">
          <input class="input grow" style="height:32px" data-bind="zoneRules.${i}.source" value="${esc(r.source || '')}" placeholder="Sumber penamaan (mis. dokumen proyek 3.9)" aria-label="Sumber">
          <button class="icon-btn sm" type="button" data-act="ruleMove" data-i="${i}" data-d="-1" aria-label="Naik">${U.icon('up')}</button>
          <button class="icon-btn sm" type="button" data-act="ruleMove" data-i="${i}" data-d="1" aria-label="Turun">${U.icon('down')}</button>
          <button class="icon-btn sm danger" type="button" data-act="ruleDel" data-i="${i}" aria-label="Hapus aturan">${U.icon('delete')}</button></div>
        <div class="stack"><span class="hint">Jika (semua syarat):</span>${U.clauseEditor(`zoneRules.${i}.when`, r.when || [], cellTokens.concat('SITE'), 'ctok' + i)}</div>
        <div class="fields"><div class="field"><label for="fe${i}">Untuk tiap baris</label><select id="fe${i}" data-change="ruleForEach" data-i="${i}"><option value="">— (satu kali per site)</option>${U.attrOptions(r.forEach)}</select></div></div>
        <div class="stack"><span class="hint">Pola nama zone (diurutkan: tiap baris "untuk tiap", lalu tiap pola):</span>
          ${(r.patterns || []).map((p, k) => `<div class="inline" style="flex-wrap:nowrap"><div style="flex:1">${U.patternEditor(`zoneRules.${i}.patterns.${k}`, p, null)}</div>
            <button class="icon-btn sm danger" type="button" data-act="patDel" data-i="${i}" data-k="${k}" aria-label="Hapus pola">${U.icon('close')}</button></div>`).join('')}
          <button class="btn sm text" type="button" data-act="patAdd" data-i="${i}" style="align-self:flex-start">${U.icon('add')}Pola</button>
          <datalist id="ztok${i}">${zoneTokens.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
        <div class="sample" data-part="z-${i}">${ruleSample(A, i)}</div>
      </div>`;
    }).join('') || '<p class="hint">Belum ada aturan zone. Tanpa aturan, file B3 tidak dibuat.</p>';
  }

  U.screens[4] = {
    title: 'Template konvensi',
    sub: 'Susun pola dari token attribute dan teks bebas. Contoh hasil dan validasi aturan E3D diperbarui langsung.',
    get parts() {
      const p = Object.assign({}, parts);
      (A.config.zoneRules || []).forEach((r, i) => { p['z-' + i] = A => ruleSample(A, i); });
      return p;
    },
    select(A, loc) { A.ui.tplFocus = loc.template ? 'tpl-' + loc.template : loc.zoneRule !== undefined ? 'rule-' + loc.zoneRule : null; },
    render(A) {
      return `<div class="split">
        <aside class="side card" aria-label="Token">${palette(A)}</aside>
        <div class="grow">
          ${GROUPS.map(([title, keys]) => `<section class="card"><h2>${title}</h2><div class="tcards">${keys.map(k => tcard(A, k)).join('')}</div></section>`).join('')}
          <section class="card" aria-label="Aturan zone" data-loc="f:zoneRules">
            <div class="card-head"><div><h2>Aturan zone · ${(A.config.zoneRules || []).length}</h2><div class="sub">Dicek per sel, berurutan. Zone dibuat dengan "/site" lalu NEW ZONE.</div></div>
              <button class="btn sm tonal" type="button" data-act="ruleAdd">${U.icon('add')}Aturan</button></div>
            <div class="chips" data-part="zoneHead">${parts.zoneHead(A)}</div>

    },
    mount(root) {

      if (root.dataset.tplBound) return;   // #main persists across renders: bind once
      root.dataset.tplBound = '1';
      root.addEventListener('focusin', ev => remember(ev.target));
      root.addEventListener('keyup', ev => remember(ev.target));
      root.addEventListener('click', ev => {
        if (ev.target.matches('input.lit, input[data-raw]')) remember(ev.target);
        const box = ev.target.closest('.pattern');
        if (box && ev.target === box) { const lits = U.$$('input.lit', box); const l = lits[lits.length - 1]; if (l) { l.focus(); l.setSelectionRange(l.value.length, l.value.length); } }
      });
      root.addEventListener('input', ev => {
        const el = ev.target;
        if (!el.matches('input.lit')) return;
        el.size = Math.max(1, el.value.length);
        const box = el.closest('[data-pattern]');
        U.setPath(A.config, box.dataset.pattern, patternFromDom(box));
        remember(el);
        A.touch();
      });
      root.addEventListener('dragstart', ev => { const t = ev.target.closest('.tok'); if (t) { ev.dataTransfer.setData('text/plain', `{${t.dataset.tok}}`); ev.dataTransfer.effectAllowed = 'copy'; } });
      root.addEventListener('dragover', ev => { const box = ev.target.closest('.pattern'); if (box && !ev.target.matches('input')) { ev.preventDefault(); box.classList.add('drop'); } });
      root.addEventListener('dragleave', ev => { const box = ev.target.closest('.pattern'); if (box) box.classList.remove('drop'); });
      root.addEventListener('drop', ev => {
        const box = ev.target.closest('.pattern');
        if (!box || ev.target.matches('input')) return;
        ev.preventDefault(); ev.stopPropagation();
        box.classList.remove('drop');
        const tok = ev.dataTransfer.getData('text/plain');
        if (tok) insertToken(tok, { path: box.dataset.pattern, offset: null });
      });
    },
  };

  /* ---------- Actions ---------- */
  U.act.tokIns = el => insertToken(`{${el.dataset.tok}}`);
  U.act.tokSearch = el => {
    const q = el.value.toLowerCase();
    for (const g of U.$$('[data-grp]')) {
      let any = false;
      for (const t of U.$$('.tok', g)) { const hit = !q || t.dataset.tok.toLowerCase().includes(q); t.hidden = !hit; any = any || hit; }
      g.hidden = !any;
    }
  };
  U.act.patMode = el => { A.flush(); A.ui.tplRaw[el.dataset.path] = !A.ui.tplRaw[el.dataset.path]; U.renderScreen(); };
  // Token chip menu: filters and delete.
  document.addEventListener('click', ev => {
    const chip = ev.target.closest('.pattern .tchip');
    if (!chip) return;
    const box = chip.closest('[data-pattern]'), path = box.dataset.pattern;
    const segs = E.segments(String(U.getPath(A.config, path) || '')), i = +chip.dataset.tok, seg = segs[i];
    const fl = seg.filters.split('|').filter(Boolean);
    const set = list => {
      seg.text = `{${seg.path}${list.map(f => '|' + f).join('')}}`;
      A.mutate(c => U.setPath(c, path, segs.map(s => s.text).join('')));
    };
    const toggle = f => set(fl.includes(f) ? fl.filter(x => x !== f) : fl.filter(x => !(f === 'upper' && x === 'lower') && !(f === 'lower' && x === 'upper')).concat(f));
    const pad = fl.find(f => f.startsWith('pad:'));
    U.menu(chip, [
      { label: 'Huruf besar (|upper)', checked: fl.includes('upper'), run: () => toggle('upper') },
      { label: 'Huruf kecil (|lower)', checked: fl.includes('lower'), run: () => toggle('lower') },
      ...[2, 3, 4].map(n => ({ label: `Isi nol, ${n} digit (|pad:${n})`, checked: pad === 'pad:' + n, run: () => set(fl.filter(f => !f.startsWith('pad:')).concat(pad === 'pad:' + n ? [] : ['pad:' + n])) })),
      { divider: true },
      { label: 'Hapus token', icon: 'delete', run: () => { segs.splice(i, 1); A.mutate(c => U.setPath(c, path, segs.map(s => s.text).join(''))); } },
    ]);
  });
  U.act.ruleAdd = () => A.mutate(c => {
    const ids = (c.zoneRules || []).map(r => r.id);
    let n = ids.length + 1; while (ids.includes('aturan-' + n)) n++;
    const row = E.roles(E.index(c)).rowAttr;
    (c.zoneRules = c.zoneRules || []).push({ id: 'aturan-' + n, when: row ? [{ token: `${row.name}.kode`, op: 'eq', value: '' }] : [], patterns: ['{SITE}-'], source: '' });
  });
  U.act.ruleDel = async el => {
    const r = A.config.zoneRules[+el.dataset.i];
    if (!(await U.confirm(`Hapus aturan ${r.id}?`, 'Zone dari aturan ini tidak dibuat lagi. Bisa dibatalkan dengan Ctrl+Z.', 'Hapus', true))) return;
    A.mutate(c => c.zoneRules.splice(+el.dataset.i, 1));
  };
  U.act.ruleMove = el => {
    const i = +el.dataset.i, j = i + +el.dataset.d;
    if (j < 0 || j >= A.config.zoneRules.length) return;
    A.mutate(c => { const [x] = c.zoneRules.splice(i, 1); c.zoneRules.splice(j, 0, x); });
  };
  U.act.ruleForEach = el => A.mutate(c => { const r = c.zoneRules[+el.dataset.i]; if (el.value) r.forEach = el.value; else delete r.forEach; });
  U.act.patAdd = el => A.mutate(c => c.zoneRules[+el.dataset.i].patterns.push('{SITE}-'));
  U.act.patDel = el => A.mutate(c => c.zoneRules[+el.dataset.i].patterns.splice(+el.dataset.k, 1));
})(UI);

(function (U) {

  ];

  function entries(A) {

    if (l.startsWith('$*')) return `<span class="c">${esc(l)}</span>`;
    const m = l.match(KW);
    return m ? `<span class="k">${esc(m[1])}</span>${esc(m[2])}` : esc(l);
  }).join('\n');

  const parts = {
    files(A) {
      const list = entries(A);
      if (!list.some(e => e.path === A.ui.file)) A.ui.file = (list.find(e => e.file && /B2/.test(e.file.step)) || list[0] || {}).path;
      const out = [], folders = new Map();
      for (const e of list) {
        const i = e.path.lastIndexOf('/');
        const folder = i < 0 ? '' : e.path.slice(0, i);
        if (!folders.has(folder)) folders.set(folder, []);
        folders.get(folder).push(e);
      }
      for (const [folder, es] of folders) {
        if (folder) out.push(`<div class="fold">${U.icon('folder', 'sm')}${esc(folder)}/</div>`);
        for (const e of es) {
          const name = e.path.slice(e.path.lastIndexOf('/') + 1);
          const meta = e.file ? `${e.file.module} · ${U.num(e.file.text.split('\n').length - 1)} baris` : name.endsWith('.xlsx') ? 'Excel' : name.endsWith('.json') ? 'JSON' : 'teks';
          out.push(`<button type="button" class="file${folder ? '' : ' top'}" data-act="fileSel" data-path="${esc(e.path)}" aria-selected="${e.path === A.ui.file}"><span>${esc(name)}</span><span>${meta}</span></button>`);
        }
      }
      return out.join('');
    },
    preview(A) {
      const p = A.ui.file;
      if (!p) return '<p class="hint">Tidak ada file.</p>';
      const name = p.slice(p.lastIndexOf('/') + 1);
      let body;
      if (name.endsWith('.xlsx')) {
        const sheets = E.registerSheets(A.r.cfg, A.r.model, A.r.issues, A.r.files);
        body = `<div class="tbl"><table><thead><tr><th>Sheet</th><th class="num">Baris data</th><th>Kolom</th></tr></thead><tbody>${sheets.map(s => `<tr><td>${esc(s.name)}</td><td class="num">${U.num(s.rows.length - 1)}</td><td class="hint">${esc(s.rows[0].join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
      } else {
        const t = textOf(A, p) || '';
        const lines = t.split(/\r?\n/);
        const cap = 4000;
        body = `<pre class="code" id="codeView" data-keep-scroll="code">${highlight(lines.slice(0, cap).join('\n'))}${lines.length > cap ? `\n<span class="c">… ${lines.length - cap} baris lagi (unduh file untuk melihat semua)</span>` : ''}</pre>`;
      }
      return `<div class="card-head"><b class="mono" style="font-size:13px;overflow-wrap:anywhere">${esc(p)}</b><div class="inline">
          ${name.endsWith('.xlsx') ? '' : `<button class="btn sm outlined" type="button" data-act="fileCopy">${U.icon('copy')}Salin</button>`}
          <button class="btn sm outlined" type="button" data-act="fileDownload">${U.icon('download')}Unduh file ini</button></div></div>${body}`;
    },
    summary(A) {
      const n = A.r.files.length, errs = A.errors().length, o = A.config.output;
      const extra = [o.includeReadme && 'README', o.includeRegister && 'register', o.includeConfig && 'config.json'].filter(Boolean);
      return `<button class="btn filled" type="button" data-act="generateZip" ${errs ? 'disabled' : ''}>${U.icon('download')}Unduh ZIP</button>
        <span class="hint">${n} file .mac${extra.length ? ' · ' + extra.join(' · ') : ''}</span>
        ${errs ? `<span class="chip err">${U.icon('error')}${errs} error · perbaiki di Preview & validasi</span>` : ''}
        ${E.canDeflate() ? '' : '<span class="chip warn">Browser tanpa CompressionStream: ZIP tanpa kompresi</span>'}`;
    },
  };

  U.screens[6] = {
    title: 'Generate',
    sub: 'Pilih isi paket, periksa isi file, unduh ZIP, lalu jalankan di E3D sesuai urutan.',
    parts,
    select(A, loc) { if (loc.file) A.ui.file = loc.file; },
    render(A) {
      const o = A.config.output || {};
      return `<div class="split">
        <aside class="side card" aria-label="Opsi paket">
          <h2>Opsi paket</h2>
          <div class="field"><label for="pkgName">Nama ZIP</label><input id="pkgName" class="mono" data-bind="project.packageName" value="${esc(A.config.project.packageName)}" spellcheck="false"></div>
          <div class="opts"><span class="hint">Sertakan</span>${OPTS.map(([k, l, s]) => `<label for="o-${k}"><input type="checkbox" id="o-${k}" data-bind="output.${k}" ${o[k] ? 'checked' : ''}><span>${l}<small>${s}</small></span></label>`).join('')}</div>
          <div class="opts"><span class="hint">Pembagian file</span>
            <label for="sp1"><input type="radio" name="split" id="sp1" data-change="splitSet" value="perDiscipline" ${o.split !== 'perStep' ? 'checked' : ''}><span>Per baris (disiplin)<small>B1, B2, B3 di folder tiap baris</small></span></label>
            <label for="sp2"><input type="radio" name="split" id="sp2" data-change="splitSet" value="perStep" ${o.split === 'perStep' ? 'checked' : ''}><span>Satu file per langkah<small>B1, B2, B3 untuk semua baris, berurutan</small></span></label></div>
          <div class="stack" data-part="summary">${parts.summary(A)}</div>
        </aside>
        <div class="grow">
          <div class="row" style="align-items:flex-start">
            <section class="card" style="flex:1 1 260px"><h2>Isi ZIP</h2><div class="files" data-part="files">${parts.files(A)}</div></section>
            <section class="card" style="flex:2 1 420px" data-part="preview">${parts.preview(A)}</section>
          </div>
          <section class="card"><h2>Urutan jalan di E3D</h2><span class="hint">Ikut tertulis di 00-README.txt dan sheet Setup Steps.</span>
            <div class="tbl"><table><thead><tr><th>Step</th><th>Isi</th><th>File</th><th>Modul</th><th>Cek</th></tr></thead><tbody>
            ${E.RUN_ORDER.map(r => `<tr><td class="mono"><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="mono">${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')}</tbody></table></div>
            <div class="note"><b>Known issue (§7):</b> <span class="mono">(43,41) Unable to open DB … MCD:6 The handle is invalid</span> muncul acak saat CREATE DB. Catat DB-nya, hapus di Admin bila rusak, buat ulang, lanjutkan.</div>
          </section>
        </div></div>`;
    },
  };

  U.act.fileSel = el => { A.ui.file = el.dataset.path; U.refresh(); };
  U.act.splitSet = el => A.mutate(c => { c.output.split = el.value; });
  U.act.fileCopy = el => {
    const t = textOf(A, A.ui.file) || '';
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(U.$('#codeView')); getSelection().removeAllRanges(); getSelection().addRange(r); U.toast('Teks dipilih: tekan Ctrl+C'); };
    try { navigator.clipboard.writeText(t).then(() => U.toast('Disalin ke clipboard'), fallback); } catch (e) { fallback(); }
  };
  U.act.fileDownload = async () => {
    const p = A.ui.file, name = p.slice(p.lastIndexOf('/') + 1);
    if (name.endsWith('.xlsx')) {
      const x = await E.xlsx.write(E.registerSheets(A.r.cfg, A.r.model, A.r.issues, A.r.files));
      return U.download(new Blob([x], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name);
    }
    U.download(textOf(A, p), name, 'text/plain');
  };
})(UI);

/* ---- src/ui/main.js ---- */
/* Boot. Everything runs offline from one file; the CSP in index.html blocks any network request. */
(function (U) {
  'use strict';
  window.addEventListener('error', ev => U.toast && U.toast('Kesalahan tak terduga: ' + (ev.message || ev), 'error'));
  window.addEventListener('unhandledrejection', ev => U.toast && U.toast('Kesalahan tak terduga: ' + ((ev.reason && ev.reason.message) || ev.reason), 'error'));
  function boot() {
    U.buildShell();
    U.initTheme();
    U.App.load();
    U.App.recompute();
    U.renderScreen();
    U.renderChrome();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(UI);

</script>
</body>
</html>
